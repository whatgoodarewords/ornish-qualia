<!doctype html>
<html lang="en" data-theme="light" data-texture="richer" data-mode="simple" data-ink="clean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>small words · interactive paper</title>
  <link rel="stylesheet" href="styles.css?v=20260930-pressed-1">
  <script src="app.js?v=20260930-pressed-1" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3 4 4C1 8 8 21 15 21l4-2c1-1 0-2-1-3l-2-2-3 2c-3-2-5-4-6-7l2-2Z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-3 0h6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v15"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4Z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 7 3-3a5 5 0 0 1 7 7l-3 3M14 17l-3 3a5 5 0 0 1-7-7l3-3m1 8 8-8"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-7 5 8"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.5 5.5a5 5 0 0 0-7 0L12 7l-1.5-1.5a5 5 0 0 0-7 7L12 21l8.5-8.5a5 5 0 0 0 0-7Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol>
  </defs></svg>
  <div class="prototype-bar">
    <span class="prototype-label"><span class="prototype-caption">Interactive prototype <span class="toolbar-dot">·</span> <span class="device-note">stays on this device</span></span><a class="proposals-link" href="proposals.html">Design proposals</a></span>
    <div class="prototype-controls">
      <div class="theme-switch mode-switch" role="group" aria-label="Demo features">
        <button type="button" data-mode-choice="simple" aria-pressed="true">Simple</button>
        <button type="button" data-mode-choice="full" aria-pressed="false">Full demo</button>
      </div>
      <div class="theme-switch" role="group" aria-label="Appearance">
        <button type="button" data-theme-choice="light" aria-pressed="true"><svg class="icon"><use href="#i-sun"/></svg>Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false"><svg class="icon"><use href="#i-moon"/></svg>Dark</button>
      </div>
      <div class="theme-switch ink-switch" role="group" aria-label="Text finish">
        <button type="button" data-ink-choice="clean" aria-pressed="true">Clean</button>
        <button type="button" data-ink-choice="typewritten" aria-pressed="false">Pressed</button>
      </div>
      <div class="texture-control">
        <span id="texture-label">Texture:</span>
        <div class="theme-switch texture-switch" role="group" aria-labelledby="texture-label">
          <button type="button" data-texture-choice="original" aria-pressed="false">Original</button>
          <button type="button" data-texture-choice="richer" aria-pressed="true">Richer</button>
        </div>
      </div>
    </div>
  </div>
  <main class="app" id="app" aria-label="small words messenger">
    <aside class="sidebar" aria-label="Conversations">
      <div class="wordmark">small words</div>
      <button type="button" id="new-chat" class="icon-button new-chat full-only" aria-label="New conversation" title="New conversation"><svg class="icon"><use href="#i-plus"/></svg></button>
      <div class="search-well">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="chat-search" type="search" placeholder="Search" aria-label="Search conversations" autocomplete="off">
      </div>
      <nav class="chat-list" id="chat-list" aria-label="Choose a conversation"></nav>
      <p id="search-empty" class="empty-search" hidden>No conversations found.<br><span>Try a name or a few words.</span></p>
    </aside>
    <section class="conversation" aria-labelledby="conversation-title">
      <header class="conversation-header">
        <button class="icon-button mobile-back" id="back-button" type="button" aria-label="Back to conversations"><svg class="icon"><use href="#i-back"/></svg></button>
        <div class="avatar header-avatar" id="header-avatar" aria-hidden="true">FD</div>
        <div class="conversation-heading"><h1 id="conversation-title">Friday dinner</h1><p id="conversation-subtitle">6 members</p></div>
        <div class="header-actions">
          <button class="icon-button full-only" id="conversation-search" type="button" aria-label="Search this conversation" title="Search this conversation"><svg class="icon"><use href="#i-search"/></svg></button>
          <button class="icon-button" id="call-button" type="button" aria-label="Call conversation"><svg class="icon"><use href="#i-phone"/></svg></button>
          <button class="icon-button memory-toggle" id="memory-toggle" type="button" aria-label="Toggle Memory" aria-controls="memory-panel" aria-expanded="true"><svg class="icon"><use href="#i-bookmark"/></svg></button>
          <button class="icon-button" id="more-button" type="button" aria-label="Conversation information"><svg class="icon"><use href="#i-more"/></svg></button>
        </div>
      </header>
      <div class="messages" id="messages" role="log" aria-label="Messages" aria-live="off" tabindex="0"></div>
      <div class="selection-actions" id="selection-actions" role="group" aria-label="Selected message actions" hidden>
        <button type="button" id="selection-reply">Reply</button>
        <button type="button" id="selection-copy">Copy</button>
        <button type="button" id="selection-save">Save</button>
        <button type="button" id="selection-more" class="full-only" title="React, edit or delete">More</button>
        <button class="icon-button" type="button" id="selection-close" aria-label="Clear message selection"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="reply-draft" id="reply-draft" hidden>
        <div class="reply-preview"><span class="reply-author" id="reply-author"></span><span class="reply-excerpt" id="reply-excerpt"></span></div>
        <button class="icon-button" type="button" id="reply-cancel" aria-label="Cancel reply"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div id="delete-undo" class="delete-undo full-only" hidden><span>Message deleted on this device</span><button type="button" id="undo-delete">Undo</button><button type="button" class="icon-button" id="dismiss-undo" aria-label="Dismiss undo"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <form class="composer" id="composer">
        <button class="icon-button attach-button" id="attach-button" type="button" aria-label="Add attachment"><svg class="icon"><use href="#i-plus"/></svg></button>
        <div class="composer-well"><textarea id="message-input" placeholder="Message" aria-label="Message" rows="1" maxlength="4000"></textarea></div>
        <button class="icon-button" id="mic-button" type="button" aria-label="Record a voice message"><svg class="icon"><use href="#i-mic"/></svg></button>
        <button class="icon-button send-button" id="send-button" type="submit" aria-label="Send message" hidden><svg class="icon"><use href="#i-send"/></svg></button>
      </form>
    </section>
    <div class="memory-scrim" id="memory-scrim" hidden></div>
    <aside class="memory" id="memory-panel" aria-labelledby="memory-title">
      <header class="memory-header"><h2 id="memory-title">Memory</h2><button class="icon-button" id="memory-close" type="button" aria-label="Close Memory"><svg class="icon"><use href="#i-close"/></svg></button></header>
      <div class="memory-tabs" role="tablist" aria-label="Memory">
        <button id="tab-saved" role="tab" aria-selected="true" aria-controls="memory-content" data-tab="saved" type="button">Saved</button>
        <button id="tab-links" role="tab" aria-selected="false" aria-controls="memory-content" data-tab="links" type="button" tabindex="-1">Links</button>
        <button id="tab-media" role="tab" aria-selected="false" aria-controls="memory-content" data-tab="media" type="button" tabindex="-1">Media</button>
      </div>
      <div class="memory-content" id="memory-content" role="tabpanel" aria-labelledby="tab-saved" tabindex="0"></div>
    </aside>
  </main>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="selection-status" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog class="paper-dialog" id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-button" id="dialog-close" type="button" aria-label="Close dialog"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
