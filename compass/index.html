        from: id, to: peer, what: `${what}, ${d.now ? 'now' : 'later'}`, ttl: 30, quietable: true, later: !d.now, track: { key: 'poll', owner: id, id: iid, slot: 'out' },
        onArrive: () => {
          if (this.m.poll[id] !== P) return;
          if (P.held || !this.m.w[peer].nowFriends) { P.held = true; this.holdForSummary(peer, { key: 'poll', owner: id, title: P.q, from: this.nm(id), screen: 'pollIn' }); return; }
          this.arrive(peer, 'poll', id, P.q, 'pollIn', 'invite');
        },
      });
    }
    this.haptic(id, 'tick');
    this.commit();
  }

  pollVote(id, c) {
    const peer = this.other(id);
    const P = this.m.poll[peer];
    if (!P || P.peerVote) return;
    P.peerVote = c;
    P.back = { state: 'none' };
    this.send({
      from: id, to: peer, what: `vote: ${c}`, ttl: 30, prio: 'normal', track: { key: 'poll', owner: peer, id: P.id, slot: 'back' },
      onArrive: () => {
        if (this.m.poll[peer] !== P) return;
        P.votes[c] += 1;
        P.voters.push({ name: this.nm(id), choice: c });
        this.receiptTick(peer, 'poll');
        this.commit();
      },
    });
    this.haptic(id, 'tick');
    this.sumReturn(id);
    this.commit();
  }

  /* ---------- Garden announcements, host only (3.18) ---------- */

  sendAnn(text, sub) {
    const id = 'you';
    const peer = 'maya';
    const iid = ++this.seq;
    const A = this.m.ann.you = {
      id: iid, text, sub, out: { state: 'none' }, delivered: [], sentAt: this.now(), arrivedQuiet: false,
      expires: text === 'Dinner at 8' ? '20:30' : this.fmt(this.m.sec + 4 * 3600),
    };
    this.replace(id, 'annOut');
    this.send({
      from: id, to: peer, what: `announcement "${text}"`, ttl: 240, prio: 'normal', quietable: true, track: { key: 'ann', owner: id, id: iid, slot: 'out' },
      onSent: () => {
        this.fanout(id, `announcement "${text}"`);
        ['Sam', 'Ana', 'Leo', 'Rita'].forEach((n, i) => this.later(800 + i * 650, () => {
          if (this.m.ann.you !== A) return;
          this.log({ plain: `${n}'s watch picked it up.`, tech: `DELIVER server → ${n} | 512 B | simulated member` });
          A.delivered.push(n);
          this.commit();
        }));
      },
      onArrive: (quiet) => {
        if (this.m.ann.you !== A) return;
        A.arrivedQuiet = quiet;
        this.arrive(peer, 'ann', id, text, 'annIn', 'memo');
      },
      onDelivered: () => { if (this.m.ann.you === A && A.delivered.indexOf('@peer') < 0) A.delivered.push('@peer'); },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  annSeen(id) {
    // Got it only dismisses. Nothing goes back to the sender.
    this.m.w[id].pending.forEach(x => { if (x.key === 'ann') x.dismissed = true; });
    if (this.m.w[id].fromSum) { this.m.w[id].fromSum = false; this.back(id); this.sumNext(id); return; }
    this.back(id);
  }

  /* ---------- push-to-talk on Cabin 3 (3.8, 3.10) ---------- */

  quickDown(id) {
    const w = this.m.w[id];
    w.quickPressed = true;
    if (w.screen !== 'talk') this.go(id, 'talk');
    this.talkDown(id);
    this.commit();
  }

  quickUp(id) {
    const w = this.m.w[id];
    if (!w.quickPressed) return;
    w.quickPressed = false;
    this.talkUp(id);
    this.commit();
  }

  // Hold to talk. A tap shorter than 0.6 s latches the turn for 4 s, so a mouse can do both sides of story 7.
  talkDown(id) {
    const w = this.m.w[id];
    const other = this.other(id);
    const o = this.m.w[other];
    if (w.rec) { this.toast(id, 'Recording is using the mic'); this.haptic(id, 'needs'); return; }
    if (w.lowPower) { this.toast(id, 'Talk is off in low-power mode'); this.haptic(id, 'needs'); return; }
    if (w.signal === 'none') { this.toast(id, 'Talk needs signal'); this.haptic(id, 'needs'); return; }
    if (this.m.ptt && this.m.ptt !== id) { if (w.screen !== 'talk') this.toast(id, `${this.nm(this.m.ptt)} is talking`); this.haptic(id, 'needs'); return; }
    if (this.m.ptt === id) {
      this.pttStart = Date.now();
      this.pttLatched = false;
      if (this.pttLatchId) { clearTimeout(this.pttLatchId); this.timers.delete(this.pttLatchId); this.pttLatchId = null; }
      return;
    }
    this.m.ptt = id;
    this.pttStart = Date.now();
    this.pttLatched = false;
    const ch = this.chanOf(id);
    const member = ch === 'cabin' || this.isMember(other, this.m.grp[ch]);
    const heard = member && o.signal !== 'none' && !this.isQuiet(other) && !this.isPresent(other) && !o.lowPower;
    this.m.pttHeard = heard;
    this.haptic(id, 'tick');
    this.musicPause(id, 'talk');
    if (heard) {
      this.musicPause(other, 'talk');
      o.channel = ch;
      if (o.screen !== 'talk') { this.go(other, 'talk'); o.talkAuto = true; }
    }
    const A = this.nm(id);
    const B = this.nm(other);
    this.log({
      plain: `${A} talked on ${this.chanName(ch)}.`,
      tech: `TALK ${A} → server → ${heard ? B : 'none'} | 100 ms Opus chunks, sealed and signed | not stored`,
      inside: 'Only the watches can read: voice',
    });
    this.commit();
  }

  talkUp(id) {
    if (this.m.ptt !== id || this.pttLatched) return;
    if (Date.now() - (this.pttStart || 0) < 600) {
      this.pttLatched = true;
      this.pttLatchId = this.later(4000, () => { this.pttLatchId = null; this.endTalk(id); });
      this.commit();
      return;
    }
    this.endTalk(id);
  }

  endTalk(id) {
    if (this.m.ptt !== id) return;
    if (this.pttLatchId) { clearTimeout(this.pttLatchId); this.timers.delete(this.pttLatchId); this.pttLatchId = null; }
    this.pttLatched = false;
    this.m.ptt = null;
    this.musicResume(id, 'talk');
    this.musicResume(this.other(id), 'talk');
    if (this.m.pttHeard) this.haptic(this.other(id), 'tick');
    this.m.pttHeard = false;
    const o = this.m.w[this.other(id)];
    if (o.talkAuto) {
      o.talkAuto = false;
      if (o.screen === 'talk') this.back(this.other(id));
    }
    this.commit();
  }

  /* ---------- long recording (3.9) ---------- */

  recStart(id) {
    const w = this.m.w[id];
    if (w.lowPower) { this.toast(id, "Recording can't start in low-power mode"); return; }
    if (this.m.ptt === id) this.endTalk(id);
    w.rec = { startSec: this.m.sec, marks: 0, times: [] };
    this.haptic(id, 'rec');
    this.commit();
  }

  recMark(id) {
    const w = this.m.w[id];
    if (!w.rec) return;
    w.rec.marks += 1;
    w.rec.times.push(this.m.sec - w.rec.startSec);
    this.haptic(id, 'tick');
    this.commit();
  }

  recStopDown(id) {
    if (this.holdId) clearTimeout(this.holdId);
    this.holdId = setTimeout(() => { this.holdId = null; this.recStop(id); }, 900);
  }

  recStopUp() {
    if (this.holdId) { clearTimeout(this.holdId); this.holdId = null; }
  }

  recStop(id) {
    const w = this.m.w[id];
    if (!w.rec) return;
    const len = Math.max(1, this.m.sec - w.rec.startSec);
    const n = w.rec.times.length;
    w.recs.unshift({ id: 'r' + (++this.seq), when: `Today ${this.fmtMin(this.minNow() - Math.round(len / 60))}`, len, marks: w.rec.times.slice(), exp: '' });
    w.rec = null;
    this.haptic(id, 'reply');
    this.toast(id, 'Saved');
    this.later(900, () => { if (w.screen === 'record' && !w.rec) this.replace(id, 'recordings'); });
    this.commit();
  }

  /* ---------- expiry and recipients ---------- */

  expSecs(i) {
    if (i === 0) return 1800;
    if (i === 1) return 7200;
    return Math.max(600, (23 * 60 + 59 - this.minNow()) * 60);
  }

  isExp(it) { return !!(it && it.expSec && this.m.sec >= it.expSec); }

  expText(it) { return `Expired ${this.fmt(it.expSec)}`; }

  cycleExp(kind, id) {
    const d = kind === 'meet' ? this.m.meetDraft[id] : kind === 'hang' ? this.m.hangDraft[id] : this.m.pollDraft[id];
    // A Later poll also offers the after-summary close (-1).
    d.exp = kind === 'poll' && !d.now ? (d.exp + 2) % 4 - 1 : (Math.max(0, d.exp) + 1) % 3;
    this.commit();
  }

  toOpts(id) {
    const out = ['all'];
    if (this.m.friends) out.push('peer');
    Object.keys(this.m.grp).forEach(g => { if (this.isMember(id, this.m.grp[g])) out.push(g); });
    return out;
  }

  toLabel(id, to) {
    if (to === 'all') return 'Everyone listed';
    if (to === 'peer') return this.nm(this.other(id));
    const g = this.m.grp[to];
    return g ? g.name : 'Everyone listed';
  }

  skipsPeer(id, to) {
    const peer = this.other(id);
    if (to === 'all') return !this.m.w[peer].listed;
    if (to === 'peer') return !this.m.friends;
    return !this.isMember(peer, this.m.grp[to]);
  }

  inboxItem(e) {
    const bag = this.m[e.key];
    return bag && typeof bag === 'object' && e.owner in bag ? bag[e.owner] : null;
  }

  inboxAnswered(e, it) {
    if (!it) return false;
    if (e.key === 'meet') return !!it.back;
    if (e.key === 'hang') return !!it.answer;
    if (e.key === 'poll') return !!it.peerVote;
    if (e.key === 'loc') return !!it.peerChoice;
    return true;
  }

  advance() {
    this.m.sec += 1800;
    this.tick();
  }

  /* ---------- Spotify ---------- */

  musicToggle(id) {
    const w = this.m.w[id];
    const M = w.music;
    const pl = this.K.PLAYLISTS[M.pl];
    if (M.playing) { M.playing = false; M.pausedBy = ''; this.commit(); return; }
    if (!w.headphones) { this.toast(id, 'Connect headphones first'); return; }
    if (!pl.offline && w.signal === 'none') { M.blocked = true; this.commit(); return; }
    M.blocked = false;
    M.playing = true;
    M.pausedBy = '';
    this.commit();
  }

  musicSkip(id, d) {
    const M = this.m.w[id].music;
    const n = this.K.PLAYLISTS[M.pl].tracks.length;
    M.track = (M.track + d + n) % n;
    this.commit();
  }

  musicVol(id, d) {
    const M = this.m.w[id].music;
    M.vol = Math.max(0, Math.min(10, M.vol + d));
    this.commit();
  }

  musicPick(id, key) {
    const w = this.m.w[id];
    const M = w.music;
    M.pl = key;
    M.track = 0;
    if (!this.K.PLAYLISTS[key].offline && w.signal === 'none') { M.playing = false; M.blocked = true; }
    else M.blocked = false;
    this.back(id);
  }

  musicPause(id, why) {
    const M = this.m.w[id].music;
    if (M.playing) { M.playing = false; M.pausedBy = why; }
  }

  musicResume(id, why) {
    const w = this.m.w[id];
    const M = w.music;
    if (M.pausedBy !== why) return;
    M.pausedBy = '';
    if (w.headphones && (this.K.PLAYLISTS[M.pl].offline || w.signal !== 'none')) M.playing = true;
  }

  toggleHeadphones(id) {
    const w = this.m.w[id];
    w.headphones = !w.headphones;
    if (!w.headphones && (w.music.playing || w.music.pausedBy)) {
      w.music.playing = false;
      w.music.pausedBy = '';
      this.toast(id, 'Headphones off. Music paused.');
    } else if (w.headphones) this.toast(id, 'Headphones connected');
    this.commit();
  }

  /* ---------- Garden map and Google Maps ---------- */

  placeOpen(id, name) {
    this.m.w[id].placeSel = name;
    this.go(id, 'place');
  }

  placeMeet(id) {
    const w = this.m.w[id];
    if (!this.m.friends) { this.toast(id, 'Add a friend first'); return; }
    this.m.meetDraft[id].place = w.placeSel;
    this.go(id, 'meetWhen');
  }

  placeNav(id) {
    const w = this.m.w[id];
    w.navTarget = w.placeSel;
    this.go(id, 'arrow');
  }

  findFriend(id) {
    this.m.w[id].navTarget = '';
    this.go(id, 'arrow');
  }

  gmStart(id, i) {
    const w = this.m.w[id];
    const dst = this.K.DEST[i];
    w.gm = { dest: dst[0], mins: dst[2], step: 0, stepSec: this.m.sec, active: true, arrived: false };
    this.go(id, 'gmaps');
  }

  gmEnd(id) {
    const w = this.m.w[id];
    w.gm.active = false;
    w.gm.arrived = false;
    this.back(id);
  }

  /* ---------- calendar ---------- */

  fireReminders(id) {
    const w = this.m.w[id];
    const t = this.minNow();
    const present = this.isPresent(id);
    for (let i = 0; i < w.cal.length; i++) {
      const ev = w.cal[i];
      if (ev.dismissed || ev.fired || t < ev.remindAt) continue;
      // A reminder held by Present whose event has ended goes to the summary instead.
      if (t >= ev.t + 60) {
        if (ev.held) { ev.fired = true; ev.held = false; this.holdForSummary(id, { key: 'remind', owner: id, title: `${ev.title} at ${this.fmtMin(ev.t)}`, from: ev.place, screen: '' }); }
        continue;
      }
      if (present) { ev.held = true; continue; }
      ev.fired = true;
      ev.held = false;
      w.remindIdx = i;
      this.haptic(id, 'remind');
      this.go(id, 'reminder');
      return;
    }
  }

  remindSnooze(id) {
    const w = this.m.w[id];
    const ev = w.cal[w.remindIdx];
    if (ev) { ev.remindAt = this.minNow() + 10; ev.fired = false; }
    this.back(id);
  }

  remindDismiss(id) {
    const w = this.m.w[id];
    const ev = w.cal[w.remindIdx];
    if (ev) ev.dismissed = true;
    this.back(id);
  }

  nextEvent(id) {
    const t = this.minNow();
    return this.m.w[id].cal.find(ev => !ev.dismissed && ev.t >= t) || null;
  }

  /* ---------- recordings ---------- */

  lenText(sec) {
    const s = Math.max(0, Math.round(sec));
    if (s >= 3600) return `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`;
    if (s >= 60) return `${Math.floor(s / 60)} min`;
    return `${s} s`;
  }

  recById(id) {
    const w = this.m.w[id];
    return w.recs.find(r => r.id === w.recSel) || null;
  }

  recOpen(id, rid) {
    const w = this.m.w[id];
    w.recSel = rid;
    w.recPlay = { playing: false, pos: 0 };
    this.go(id, 'recDetail');
  }

  recToggle(id) {
    const P = this.m.w[id].recPlay;
    if (P.pos >= 1) P.pos = 0;
    P.playing = !P.playing;
    this.commit();
  }

  recJump(id, at) {
    const r = this.recById(id);
    if (!r) return;
    const P = this.m.w[id].recPlay;
    P.pos = Math.min(1, at / r.len);
    P.playing = true;
    this.commit();
  }

  recExport(id) {
    const r = this.recById(id);
    if (r && r.exp !== 'done') r.exp = 'waiting';
    this.commit();
  }

  recDeleteYes(id) {
    const w = this.m.w[id];
    w.recs = w.recs.filter(r => r.id !== w.recSel);
    w.recSel = '';
    this.back(id);
    this.back(id);
  }

  /* ---------- temporary groups ---------- */

  isMember(id, g) {
    if (!g) return false;
    return g.owner === id || (g.peerState === 'joined' && id !== g.owner);
  }

  chanOf(id) {
    const ch = this.m.w[id].channel;
    return ch === 'cabin' || this.m.grp[ch] ? ch : 'cabin';
  }

  chanName(ch) {
    return ch === 'cabin' ? 'Cabin 3' : (this.m.grp[ch] ? this.m.grp[ch].name : 'Cabin 3');
  }

  groupCreate(id) {
    const w = this.m.w[id];
    const peer = this.other(id);
    const d = w.groupDraft;
    const endSec = d.end === 1 ? 1800 : d.end === 2 ? 7200 : Math.max(600, (23 * 60 - this.minNow()) * 60);
    const gid = 'g' + (++this.seq);
    const withPeer = d.withPeer && this.m.friends;
    const later = withPeer && !d.now;
    const g = { id: gid, name: d.title, owner: id, peerState: withPeer ? 'invited' : 'none', endsAt: this.m.sec + endSec, endTxt: this.fmt(this.m.sec + endSec), out: { state: 'none' }, held: later };
    this.m.grp[gid] = g;
    w.groupSel = gid;
    this.endFlow(id, 'groupHost');
    if (withPeer) {
      this.send({
        from: id, to: peer, what: `group invite: ${g.name}, ends ${g.endTxt}, ${later ? 'later' : 'now'}`, ttl: 30, quietable: true, later, track: { key: 'grp', owner: gid, id: gid, slot: 'out' },
        onArrive: () => {
          if (!this.m.grp[gid]) return;
          if (later || !this.m.w[peer].nowFriends) { g.held = true; this.holdForSummary(peer, { key: 'group', owner: id, title: `Group: ${g.name}`, from: this.nm(id), screen: 'groupIn', gid }); return; }
          this.m.w[peer].groupSel = gid;
          this.arrive(peer, 'group', id, `Group: ${g.name}`, 'groupIn', 'invite');
          if (this.m.inbox[peer][0] && this.m.inbox[peer][0].key === 'group') this.m.inbox[peer][0].gid = gid;
        },
      });
    }
    this.haptic(id, 'tick');
    this.commit();
  }

  groupAnswer(id, choice) {
    const g = this.m.grp[this.m.w[id].groupSel];
    if (!g || g.peerState !== 'invited') return;
    g.peerState = choice === 'in' ? 'joining' : 'passing';
    this.send({
      from: id, to: g.owner, what: `group answer: ${choice === 'in' ? 'join' : 'pass'}`, ttl: 30, receipt: false,
      onArrive: () => {
        if (!this.m.grp[g.id]) return;
        g.peerState = choice === 'in' ? 'joined' : 'passed';
        this.receiptTick(g.owner, 'grp');
        const ow = this.m.w[g.owner];
        if (!(ow.screen === 'groupHost' && ow.groupSel === g.id)) this.toast(g.owner, `${this.nm(id)} ${choice === 'in' ? 'joined' : 'passed'}`);
        this.commit();
      },
    });
    this.haptic(id, 'tick');
    this.sumReturn(id);
    this.commit();
  }

  groupTalk(id) {
    const w = this.m.w[id];
    if (this.m.grp[w.groupSel]) w.channel = w.groupSel;
    this.go(id, 'talk');
  }

  endGroups() {
    Object.keys(this.m.grp).forEach(gid => {
      const g = this.m.grp[gid];
      if (this.m.sec < g.endsAt) return;
      delete this.m.grp[gid];
      ['you', 'maya'].forEach(id => {
        const w = this.m.w[id];
        const was = g.owner === id || g.peerState === 'joined' || g.peerState === 'invited' || g.peerState === 'joining';
        if (w.channel === gid) w.channel = 'cabin';
        if (this.m.hangDraft[id].to === gid) this.m.hangDraft[id].to = 'all';
        if (this.m.pollDraft[id].to === gid) this.m.pollDraft[id].to = 'all';
        this.m.inbox[id] = this.m.inbox[id].filter(e => !(e.key === 'group' && e.gid === gid));
        if (w.groupSel === gid && (w.screen === 'groupHost' || w.screen === 'groupIn')) this.replace(id, 'groups');
        if (was) this.toast(id, `${g.name} ended`);
      });
    });
  }

  /* ---------- add a friend ---------- */

  holdTogether() {
    const a = this.m.w.you;
    const b = this.m.w.maya;
    if (this.m.friends) { ['you', 'maya'].forEach(id => this.toast(id, `Already friends with ${this.nm(this.other(id))}`)); return; }
    if (a.screen === 'addFriend' && b.screen === 'addFriend') {
      a.friendState = 'near';
      b.friendState = 'near';
      this.haptic('you', 'tick');
      this.haptic('maya', 'tick');
    } else {
      ['you', 'maya'].forEach(id => this.toast(id, 'Open Add a friend on both watches'));
    }
    this.commit();
  }

  friendAdd(id) {
    const w = this.m.w[id];
    const o = this.m.w[this.other(id)];
    if (w.friendState !== 'near') return;
    w.friendState = 'confirmed';
    if (o.friendState === 'confirmed') {
      this.m.friends = true;
      w.friendState = 'done';
      o.friendState = 'done';
      w.justAdded = true;
      o.justAdded = true;
      this.haptic('you', 'reply');
      this.haptic('maya', 'reply');
    }
    this.commit();
  }

  friendCancel(id) {
    this.back(id); // leave() resets the pairing
  }

  /* ---------- tap to pay ---------- */

  backKey(id) {
    if (this.backTimers[id]) {
      clearTimeout(this.backTimers[id]);
      this.timers.delete(this.backTimers[id]);
      this.backTimers[id] = null;
      this.openWallet(id);
      return;
    }
    this.backTimers[id] = this.later(350, () => { this.backTimers[id] = null; this.back(id); });
  }

  openWallet(id) {
    const w = this.m.w[id];
    w.wallet = 'ready';
    if (w.screen !== 'wallet') this.go(id, 'wallet');
    else this.commit();
  }

  tapReader(id) {
    const w = this.m.w[id];
    if (w.screen !== 'wallet' || w.wallet !== 'ready') return;
    w.wallet = 'paid';
    w.walletAt = this.now();
    this.haptic(id, 'paid');
    this.commit();
  }

  /* ---------- stories ---------- */

  startStory(n) {
    this.reset();
    this.m.story = n;
    const base = ['face', 'home'];
    const card = ['face', 'home', 'people', 'card'];
    const plans = ['face', 'home', 'plans'];
    const apps = ['face', 'apps'];
    if (n === 1) this.jump('maya', 'meetPick', card);
    if (n === 2) this.jump('you', 'card', ['face', 'home', 'people']);
    if (n === 3) this.jump('you', 'hangNew', plans);
    if (n === 4) {
      this.m.w.maya.signal = 'none';
      this.m.w.maya.lastSeen = this.now();
      this.jump('maya', 'card', ['face', 'home', 'people']);
    }
    if (n === 5) {
      const w = this.m.w.maya;
      w.quietOn = true;
      w.quietStart = 17 * 60;
      w.quietEnd = 7 * 60 + 30;
      this.jump('maya', 'settings', apps);
      this.jump('you', 'card', ['face', 'home', 'people']);
    }
    if (n === 6) this.jump('maya', 'pollNew', plans);
    if (n === 8) this.jump('you', 'record', ['face', 'apps', 'recordings']);
    if (n === 9) {
      const w = this.m.w.maya;
      w.signal = 'none';
      w.lastSeen = this.now();
      w.music.playing = true;
      this.jump('maya', 'music', ['face']);
    }
    if (n === 10) this.jump('you', 'map', ['face', 'home', 'people']);
    if (n === 11) this.jump('maya', 'gmapsHome', apps);
    if (n === 12) {
      this.m.sec = 18 * 3600 + 19 * 60 + 50 - this.K.START;
      this.m.w.maya.signal = 'none';
      this.m.w.maya.lastSeen = this.now();
    }
    if (n === 13) this.jump('you', 'recordings', apps);
    if (n === 14) this.jump('you', 'groupNew', ['face', 'home', 'plans', 'groups']);
    if (n === 15) {
      this.m.friends = false;
      this.jump('you', 'addFriend', ['face', 'home', 'people']);
      this.jump('maya', 'addFriend', ['face', 'home', 'people']);
    }
    if (n === 16) this.jump('you', 'meetPick', card);
    if (n === 18) this.jump('you', 'card', ['face', 'home', 'people']);
    this.initHeard();
    if (n === 19) {
      this.m.sec = 18 * 3600 + 35 * 60 - this.K.START;
      ['you', 'maya'].forEach(x => this.m.w[x].cal.forEach(ev => { ev.fired = true; }));
      this.jump('you', 'card', ['face', 'home', 'people']);
    }
    this.commit();
  }

  setName(id, e) {
    const v = e && e.target ? String(e.target.value).slice(0, 20) : '';
    this.m.names[id] = v;
    this.commit();
  }

  /* ---------- clock tick ---------- */

  tick() {
    const m = this.m;
    m.sec += 1;
    ['you', 'maya'].forEach(r => {
      const L = m.loc[r];
      const a = this.other(r);
      if (!L || L.peerChoice !== 'period' || L.stopped) return;
      if (m.sec >= L.untilSec) { this.stopSharing(a); return; }
      if (m.sec - L.lastFix >= 10 && this.sigOf(a) !== 'none') {
        L.lastFix = m.sec;
        this.send({
          from: a, to: r, what: 'location fix, sharing period', prio: 'normal', ttl: 5, receipt: false, fix: true,
          onArrive: () => {
            if (this.m.loc[r] !== L || L.stopped || !L.answer) return;
            L.prevDist = L.dist;
            L.dist = Math.max(30, L.dist - 7 + Math.round(Math.random() * 4));
            L.fixSec = this.m.sec;
            this.commit();
          },
        });
      }
    });
    ['you', 'maya'].forEach(s => {
      const M = m.meet[s];
      if (M && M.walking && M.dist > 35) M.dist = Math.max(35, M.dist - 30);
    });
    this.endGroups();
    ['you', 'maya'].forEach(o => {
      const P = m.poll[o];
      if (P && P.simRelease && m.sec >= P.simDue) { const f = P.simRelease; P.simRelease = null; if (!this.isExp(P)) f(); }
    });
    ['you', 'maya'].forEach(id => {
      const w = m.w[id];
      this.fireReminders(id);
      this.sumTick(id);
      const G = w.gm;
      if (G.active && !G.arrived && w.signal !== 'none' && m.sec - G.stepSec >= 6) {
        G.step += 1;
        G.stepSec = m.sec;
        if (G.step >= this.K.ROUTE.length) G.arrived = true;
      }
      if (w.recPlay.playing) {
        const rp = w.recs.find(x => x.id === w.recSel);
        w.recPlay.pos = Math.min(1, w.recPlay.pos + (rp ? 1 / rp.len : 1));
        if (w.recPlay.pos >= 1) w.recPlay.playing = false;
      }
    });
    this.commit();
  }

  /* ---------- row builders for the round list ---------- */

  lines(text, size, width) {
    return Math.max(1, Math.ceil(String(text).length * size * 0.52 / width));
  }

  row(kind, o) {
    return Object.assign({
      kind, h: 40, chipOp: '1', cursor: 'pointer', text: '', sub: '', hasSub: false, label: '', d: '', hasIcon: false, trail: '', hasTrail: false, trailFg: '#B4BEB7',
      selected: false, mt: 0, y0: 0, size: 24, fg: '#EEF2EF', bg: '#1E2622', subFg: '#B4BEB7', labelSize: 30, aria: '', pressed: 'false', disabled: 'false',
      chip: { label: '', d: '', fg: '', bg: '' }, items: [], over: '', hasOver: false, wd: 0,
      a: { label: '', sub: '', hasSub: false, aria: '', bg: '', fg: '', pick: this.noop }, b: { label: '', sub: '', hasSub: false, aria: '', bg: '', fg: '', pick: this.noop },
      value: '', groupAria: '', pillH: 72, pillR: 36, decAria: '', incAria: '', track: '', knob: '', knobX: 4, radius: 52, w: 0, count: '', deg: 0, dist: '', initial: '', name: '',
      pick: this.noop, dec: this.noop, inc: this.noop,
      checkD: this.K.I.check, minusD: this.K.I.minus, plusD: this.K.I.plus,
    }, o);
  }

  H(text, sub) {
    const n = this.lines(text, 28, 340);
    return this.row('header', { text, sub: sub || '', hasSub: !!sub, h: n * 34 + (sub ? 32 : 0) + 6 });
  }

  C(label, o) {
    const opt = o || {};
    const tone = opt.tone || 'tonal';
    const T = { tonal: ['#1E2622', '#EEF2EF', '#B4BEB7'], primary: ['#8FE3B0', '#062012', '#1D4A31'], muted: ['#141917', '#C9D2CB', '#9AA59E'], off: ['#141917', '#7F8A83', '#7F8A83'] }[tone];
    return this.row('chip', {
      label, sub: opt.sub || '', hasSub: !!opt.sub, d: opt.icon ? this.K.I[opt.icon] : '', hasIcon: !!opt.icon,
      over: opt.over || '', hasOver: !!opt.over,
      trail: opt.trail || '', hasTrail: !!opt.trail, trailFg: opt.trailFg || T[2], selected: !!opt.selected,
      bg: T[0], fg: T[1], subFg: T[2], labelSize: opt.labelSize || (opt.sub || opt.over ? 28 : 30), aria: opt.aria || (opt.over ? `${opt.over}: ${label}` : opt.sub ? `${label}, ${opt.sub}` : label),
      pick: opt.pick || this.noop, h: 88, disabled: tone === 'off' && !opt.pick ? 'true' : 'false',
      chipOp: tone === 'off' && !opt.pick ? '0.4' : '1', cursor: tone === 'off' && !opt.pick ? 'default' : 'pointer',
    });
  }

  B(text, o) {
    const opt = o || {};
    const size = opt.size || 44;
    const n = this.lines(text, size, 384);
    return this.row('big', { text, size, fg: opt.fg || '#EEF2EF', h: Math.round(n * size * 1.12) + 4 });
  }

  T(text, o) {
    const opt = o || {};
    const size = opt.size || 24;
    const n = this.lines(text, size, 352);
    return this.row('text', { text, size, fg: opt.fg || '#C9D2CB', h: n * Math.round(size * 1.3) + 2 });
  }

  G(label, on, pick, sub) {
    return this.row('toggle', {
      label, sub: sub || '', hasSub: !!sub, pressed: on ? 'true' : 'false', pick, h: 88, radius: 44,
      aria: `${label}, ${on ? 'on' : 'off'}`,
      track: on ? '#8FE3B0' : '#3A453E', knob: on ? '#062012' : '#C9D2CB', knobX: on ? 34 : 4,
    });
  }


  N(label, value, dec, inc) {
    return this.row('stepper', { label, value: String(value), dec, inc, decAria: `${label}: less`, incAria: `${label}: more`, h: 116 });
  }

  // Later or Now: the sender's choice for memos and polls. Later is the default.
  // Pills (72 px) rather than chips, so the memo screen shows the transcript and this choice without a scroll.
  LN(now, set) {
    const opt = (label, on, v) => ({ label, selected: on, pressed: on ? 'true' : 'false', checkD: this.K.I.check, bg: on ? '#8FE3B0' : '#1E2622', fg: on ? '#062012' : '#EEF2EF', pick: () => set(v) });
    return this.OPT([opt('Later', !now, false), opt('Now', now, true)], 'Arrives', 52);
  }

  // "Arrives", the Later or Now pair, and what that means for this recipient. Summary times
  // and the recipient's settings stay on their watch (3.33 privacy), so the line names no time.
  arrives(add, now, set, P) {
    add(this.T('Arrives', { size: 18, fg: '#B4BEB7' }));
    add(this.LN(now, set));
    const who = P || 'each person';
    add(this.T(now ? `Buzzes ${P || 'them'} now, if free` : `In ${who}'s next summary`, { size: 20, fg: '#EEF2EF' }));
  }

  PR(a, b) {
    const fill = (x) => Object.assign({ sub: '', hasSub: !!x.sub, aria: x.sub ? `${x.label}, ${x.sub}` : x.label }, x);
    return this.row('pair', { a: fill(a), b: fill(b), h: 104 });
  }

  SW(items) {
    return this.row('swatches', { items, h: 64 });
  }

  pill(label, pick) {
    return { label, selected: false, pressed: 'false', checkD: this.K.I.check, bg: '#1E2622', fg: '#EEF2EF', pick };
  }

  OPT(items, aria, pillH) {
    const ph = pillH || 72;
    let rows = 1;
    let x = 0;
    items.forEach(it => {
      const wdt = it.label.length * 12.5 + 48 + (it.selected ? 30 : 0);
      if (x > 0 && x + 10 + wdt > 384) { rows += 1; x = wdt; } else { x = x > 0 ? x + 10 + wdt : wdt; }
    });
    return this.row('options', { items, groupAria: aria || 'Answers', pillH: ph, pillR: ph / 2, h: rows * ph + (rows - 1) * 10 });
  }

  PROG(frac) {
    return this.row('progress', { w: Math.round(300 * frac), h: 20 });
  }

  BAR(label, count, wdt) {
    return this.row('bar', { label, count: String(count), w: wdt, h: 40 });
  }

  AR(deg, dist, place) {
    return this.row('arrow', { deg, dist, sub: place || '', hasSub: !!place, h: 74 });
  }

  // State block after you act: what you sent and its delivery word.
  ST(text, st) {
    const chip = this.chipOf(st);
    const wait = st && st.wait ? st.wait : '';
    const n = this.lines(`${text} · ${chip.label}`, 22, 300);
    const nw = wait ? this.lines(wait, 20, 352) : 0;
    return this.row('state', { text, chip, sub: wait, hasSub: !!wait, h: 28 + n * 29 + (wait ? 8 + nw * 26 : 0) });
  }

  AV(initial, name, bg, fg) {
    return this.row('avatar', { initial, name, bg, fg, h: 150 });
  }

  PER(initial, name, sub, bg, fg) {
    return this.row('person', { initial, name, sub, bg, fg, h: 64 });
  }

  ACT(items) {
    items = items.map(x => Object.assign({ disabled: 'false', op: '1', aria: x.label }, x, x.off ? { disabled: 'true', op: '0.45', pick: this.noop } : {}));
    return this.row('actions', { items, h: 116, wd: items.length * 104 + (items.length - 1) * 16 });
  }

  E(label, pick, o) {
    const opt = o || {};
    const dis = !!opt.disabled;
    return {
      show: true, label, pick: dis ? this.noop : pick, disabled: dis ? 'true' : 'false',
      bg: dis ? '#232B26' : (opt.bg || '#8FE3B0'), fg: dis ? '#7F8A83' : (opt.fg || '#062012'),
    };
  }

  chipOf(st) {
    const s = st && st.state !== 'none' ? st : { state: 'saved' };
    let k = s.state;
    if (k === 'delivered' && s.quiet) k = 'quiet';
    const c = this.K.CHIP[k] || this.K.CHIP.saved;
    const t = this.K.TONE[c[2]];
    return { label: c[0], d: this.K.I[c[1]], fg: t.fg, bg: t.bg, stateFg: c[2] === 'neutral' ? '#DDE5DF' : '#8FE3B0' };
  }

  /* ---------- screen contents ---------- */

  // What a watch last heard from the other watch's status item (sendStatus). It shows nothing newer than that.
  snapStatus(x) {
    const w = this.m.w[x];
    return { present: !!(w.present || this.hangNow(x)), dnd: w.dnd, until: w.until, status: w.status, quietOn: w.quietOn, quietStart: w.quietStart, quietEnd: w.quietEnd };
  }

  initHeard() {
    this.m.heard = { you: this.snapStatus('maya'), maya: this.snapStatus('you') };
  }

  heardPresent(id) {
    return !!this.m.heard[id].present || !!this.hangNow(this.other(id));
  }

  heardQuiet(id) {
    const h = this.m.heard[id];
    if (h.dnd) return `Do not disturb until ${h.until}`;
    if (h.status !== 'Free') return `${h.status} until ${h.until}`;
    if (h.quietOn && this.inWindow(h.quietStart, h.quietEnd, this.minNow())) return `Quiet hours until ${this.fmtMin(h.quietEnd)}`;
    return '';
  }

  peerLine(id) {
    if (this.heardPresent(id)) return `${this.nm(this.other(id))} is present. It waits.`;
    const q = this.heardQuiet(id);
    if (q) return q;
    const L = this.m.loc[id];
    if (L && L.fixSec !== null && (L.answer === 'once' || L.answer === 'period') && !L.stoppedSeen) {
      return `${L.dist} m, ${this.ago(this.m.sec - L.fixSec)}`;
    }
    return '';
  }

  whereRows(id) {
    const m = this.m;
    const out = [];
    const L = m.loc[id];
    if (L && L.fixSec !== null && (L.answer === 'once' || L.answer === 'period') && !L.stoppedSeen) {
      const age = m.sec - L.fixSec;
      out.push({ name: this.nm(this.other(id)), sub: `${L.dist} m, ${age > 120 ? 'last seen ' : ''}${this.ago(age)}`, pick: () => this.go(id, 'arrow') });
    }
    const sim = (who) => () => this.toast(id, `${who} has no watch in this demo`);
    if (id === 'you') {
      out.push({ name: 'Sam', sub: '300 m, 1 min ago', pick: sim('Sam') });
      out.push({ name: 'Leo', sub: '1.2 km, last seen 25 min ago', pick: sim('Leo') });
    } else {
      out.push({ name: 'Sam', sub: '210 m, 2 min ago', pick: sim('Sam') });
      out.push({ name: 'Ana', sub: '450 m, last seen 9 min ago', pick: sim('Ana') });
    }
    return out;
  }

  screenModel(id) {
    const K = this.K;
    const m = this.m;
    const w = m.w[id];
    const peer = this.other(id);
    const P = this.nm(peer);
    const rows = [];
    let edge = null;
    const add = (r) => rows.push(r);
    const go = (s) => () => this.go(id, s);
    const green = '#8FE3B0';
    const sec = '#B4BEB7';
    const sc = w.screen;

    if (sc === 'home') {
      const waiting = this.waitingCount(id);
      // Four round buttons, all on screen at rest, like the person card.
      add(this.H('Garden', waiting ? `${waiting} waiting to send` : ''));
      add(this.ACT([{ label: 'People', d: K.I.user, pick: go('people') }, { label: 'Talk', d: K.I.talk, pick: go('talk') }]));
      add(this.ACT([{ label: 'Plans', d: K.I.plan, pick: go('plans') }, { label: 'Inbox', d: K.I.inbox, pick: go('inbox') }]));
    }

    if (sc === 'apps') {
      const M = w.music;
      add(this.H('Apps'));
      add(this.C('Garden', { icon: 'garden', pick: () => this.replace(id, 'home') }));
      add(this.C('Spotify', { icon: 'music', sub: M.playing ? K.PLAYLISTS[M.pl].tracks[M.track][0] : '', pick: go('music') }));
      add(this.C('Maps', { icon: 'nav', pick: go('gmapsHome') }));
      add(this.C('Calendar', { icon: 'plan', pick: go('calendar') }));
      add(this.C('Record', { icon: 'record', sub: w.rec ? `REC ${this.dur(m.sec - w.rec.startSec)}` : '', pick: go('recordings') }));
      add(this.C('Wallet', { icon: 'card', pick: () => this.openWallet(id) }));
      add(this.C('Torch', { icon: 'torch', pick: go('torch') }));
      add(this.C('Settings', { icon: 'settings', pick: go('settings') }));
    }

    if (sc === 'people') {
      add(this.H('People'));
      if (m.friends) add(this.C(P, { icon: 'user', sub: this.peerLine(id), pick: go('card') }));
      else add(this.C('Add a friend', { icon: 'userPlus', pick: go('addFriend') }));
      add(this.C("Where's everyone", { icon: 'where', pick: go('where') }));
      add(this.C('Garden map', { icon: 'map', pick: go('map') }));
      if (m.friends) add(this.C('Add a friend', { icon: 'userPlus', pick: go('addFriend') }));
    }

    if (sc === 'plans') {
      add(this.H('Plans'));
      add(this.C('Plan a hang', { icon: 'plan', pick: go('hangNew') }));
      add(this.C('Poll', { icon: 'poll', pick: go('pollNew') }));
      add(this.C('Groups', { icon: 'group', sub: 'Talk channels that end', pick: go('groups') }));
      if (id === 'you') add(this.C('Announce', { icon: 'announce', sub: 'To everyone', pick: go('annNew') }));
    }

    // Later: what is waiting for the next summary, the last summary, memos and past items.


    if (sc === 'card') {
      const col = K.COLORS[m.w[peer].color];
      const nudged = this.pingedAt(id);
      add(this.PER(P.charAt(0).toUpperCase(), P, this.peerLine(id), col[0], col[1]));
      add(this.ACT([nudged !== null ? { label: `Nudged ${this.fmt(nudged)}`, d: K.I.nudge, off: true } : { label: 'Nudge', d: K.I.nudge, pick: go('pingPick') }, { label: 'Where', d: K.I.where, pick: () => this.whereFor(id) }]));
      add(this.ACT([{ label: 'Meet', d: K.I.flag, pick: go('meetPick') }, { label: 'Memo', d: K.I.mic, pick: go('memoRec') }]));
    }

    if (sc === 'pingPick') {
      add(this.H(`Nudge ${P}`));
      K.NUDGES.forEach(t => add(this.C(t[0], { icon: t[1], pick: () => this.sendPing(id, t[0]) })));
    }

    if (sc === 'pingOut') {
      const it = m.ping[id];
      add(this.H(`Nudge ${P}`));
      if (it) {
        add(this.ST(`You: ${it.text}`, it.out));
        if (it.reply) add(this.T(`${P}: ${it.reply}`, { size: 26, fg: green }));
      }
    }

    if (sc === 'pingIn') {
      const it = m.ping[peer];
      if (it) {
        add(this.H('Nudge', it.sentAt));
        if (!it.back) {
          add(this.T(`${P}: ${it.text}.`, { size: 28, fg: '#EEF2EF' }));
          add(this.OPT([this.pill('Give me 10', () => this.reply(id, 'ping', 'Give me 10')), this.pill("Can't", () => this.reply(id, 'ping', "Can't"))], 'Reply'));
          add(this.C('More replies', { icon: 'reply', tone: 'muted', pick: () => this.openReplies(id, 'ping') }));
          edge = this.E('Coming', () => this.reply(id, 'ping', 'Coming'));
        } else {
          add(this.ST(`You: ${it.replyText}`, it.back));
          add(this.T(`${P}: ${it.text}.`, { size: 24, fg: sec }));
        }
      }
    }

    if (sc === 'replies') {
      const ctx = w.replyCtx;
      add(this.H(`Reply to ${P}`));
      K.REPLIES.forEach(r => add(this.C(r, { icon: 'reply', pick: () => { this.back(id); this.reply(id, ctx, r); } })));
      add(this.C('Dictate', { icon: 'mic', tone: 'muted', pick: () => this.dictate(id, 'reply') }));
    }

    if (sc === 'memoReview') {
      const d = m.draft[id] || { dur: 0, textOn: w.memoText, transcript: '', transcribing: false };
      // Title with the length, the transcript, then Arrives with Later or Now: all above the edge button at rest.
      add(this.H(`Memo to ${P}, ${this.dur(d.dur)}`));
      if (d.textOn && d.transcribing) add(this.T('Turning speech into text', { size: 20, fg: sec }));
      if (d.textOn && !d.transcribing && d.transcript) add(this.T(`"${d.transcript}"`, { size: 20, fg: '#EEF2EF' }));
      if (!d.textOn) add(this.T('Audio only', { size: 20, fg: sec }));
      this.arrives(add, !!d.now, (v) => { if (m.draft[id]) { m.draft[id].now = v; this.commit(); } }, P);
      edge = this.E('Send', () => this.memoSend(id), { disabled: d.textOn && d.transcribing });
    }

    if (sc === 'memoOut') {
      const it = m.memo[id];
      add(this.H(`Memo to ${P}`));
      if (it) add(this.ST(`You: memo, ${this.dur(it.dur)}`, it.out));
    }

    if (sc === 'memos') {
      const mine = m.memo[id];
      add(this.H('Memos', 'You sent'));
      if (mine) add(this.C(`To ${P}, ${this.dur(mine.dur)}`, { icon: 'mic', sub: this.chipOf(mine.out).label, pick: go('memoOut') }));
      else add(this.T('No memos sent', { fg: sec }));
      edge = this.E('New memo', go('memoRec'));
    }

    if (sc === 'memoIn') {
      const mm = m.memo[peer];
      add(this.H('Memo', mm ? mm.arrivedAt : ''));
      if (mm) {
        add(this.T(`${P} sent you a memo, ${this.dur(mm.dur)}.`, { size: 28, fg: '#EEF2EF' }));
        edge = this.E('Play', () => this.memoPlay(id));
      }
    }

    if (sc === 'memoPlay') {
      const mm = m.memo[peer];
      if (mm) {
        add(this.H(`${P}, ${this.dur(mm.dur)}`));
        add(this.PROG(mm.progress));
        if (mm.transcript) add(this.T(`"${mm.transcript}"`, { size: 24, fg: '#EEF2EF' }));
        add(this.T(w.headphones ? 'Headphones' : 'Watch speaker', { size: 20, fg: '#9AA59E' }));
        edge = mm.playing ? this.E('Pause', () => this.memoPause(id)) : this.E('Play', () => this.memoPlay(id));
      }
    }

    if (sc === 'askOut') {
      const L = m.loc[id];
      add(this.H('Where'));
      if (L) {
        add(this.ST('You: Where are you?', L.out));
        if (!L.answer && !L.cancel && this.isExp(L)) add(this.T(this.expText(L), { size: 24, fg: '#9AA59E' }));
        if (!L.answer && !L.cancel && !this.isExp(L)) {
          add(this.T(`Waiting for ${P}. Expires ${L.expires}.`, { size: 22, fg: '#EEF2EF' }));
          add(this.C('Cancel', { icon: 'x', tone: 'muted', pick: () => this.cancelAsk(id) }));
        }
        if (L.cancel) add(this.T(({ requested: 'Cancel requested', done: 'Cancelled', already: `${P} already chose. Too late to cancel.` })[L.cancel] || '', { fg: '#EEF2EF' }));
        if (L.answer === 'no') add(this.T(`${P} said not now`, { fg: '#EEF2EF' }));
        if (L.answer === 'paused') add(this.T(L.pausedText, { fg: '#EEF2EF' }));
        if (L.answer === 'once' || L.answer === 'period') {
          add(this.T(L.answer === 'once' ? `${P} shared their location` : `${P} shared their location for 30 min`, { fg: green }));
          edge = this.E('Show arrow', () => this.replace(id, 'arrow'));
        }
      }
    }

    if (sc === 'locIn') {
      const L = m.loc[peer];
      const open = L && !L.peerChoice && !this.isExp(L);
      add(this.H('Where', open ? `Expires ${L.expires}` : ''));
      if (L && !L.peerChoice) add(this.T(`${P} asks where you are.`, { size: 28, fg: this.isExp(L) ? '#7F8A83' : '#EEF2EF' }));
      if (L && !L.peerChoice && this.isExp(L)) {
        add(this.T(this.expText(L), { size: 24, fg: '#9AA59E' }));
      } else if (open) {
        // Pills, so all three answers sit above the fade at 404 px.
        const ch = (label, mode, bg, fg) => ({ label, selected: false, pressed: 'false', checkD: K.I.check, bg, fg, pick: () => this.shareAnswer(id, mode) });
        add(this.OPT([ch('Share once', 'once', '#8FE3B0', '#062012'), ch('Share 30 min', 'period', '#1E2622', '#EEF2EF'), ch('Not now', 'no', '#141917', '#C9D2CB')], 'Answer'));
      } else if (L) {
        add(this.ST(`You: ${({ once: 'Share once', period: 'Share 30 min', no: 'Not now' })[L.peerChoice]}`, L.back));
      }
    }

    if (sc === 'sharing') {
      const L = m.loc[peer];
      add(this.H(L && L.stopped ? 'Not sharing' : `Sharing with ${P}`));
      if (L && !L.stopped) add(this.ST(`You: ${L.peerChoice === 'once' ? 'Share once' : 'Share 30 min'}`, L.back));
      if (L) {
        if (L.peerChoice === 'period' && !L.stopped) {
          add(this.B(`${Math.max(0, Math.ceil((L.untilSec - m.sec) / 60))} min left`, { size: 44, fg: green }));
          edge = this.E('Stop sharing', () => this.stopSharing(id));
        }
        if (L.peerChoice === 'once') {
          add(this.B('Shared once', { size: 40 }));
        }
        if (L.peerChoice === 'period' && L.stopped) add(this.T(`Stopped at ${L.stoppedAt}`, { fg: '#EEF2EF' }));
      }
    }

    if (sc === 'meetPick') {
      const d = m.meetDraft[id];
      add(this.H('Where?'));
      K.PLACES.forEach(p => add(this.C(p[0], { icon: 'pin', sub: `${p[1]} m`, selected: !!w.picked[sc] && (d.place === p[0]), pick: () => { w.picked[sc] = true; d.place = p[0]; this.go(id, 'meetWhen'); } })));
    }

    if (sc === 'meetWhen') {
      const d = m.meetDraft[id];
      add(this.H('When?'));
      K.WHEN.forEach(x => add(this.C(x[1], { icon: 'clock', sub: x[0] > 0 ? this.fmtMin(this.minNow() + x[0]) : x[0] === -1 && d.when === -1 ? this.fmtMin(d.at) : '', selected: !!w.picked[sc] && (d.when === x[0]), pick: () => { w.picked[sc] = true; d.when = x[0]; this.go(id, x[0] === -1 ? 'meetTime' : 'meetConfirm'); } })));
    }

    if (sc === 'meetTime') {
      const d = m.meetDraft[id];
      add(this.H('Pick a time'));
      add(this.N('Time', this.fmtMin(d.at), () => { d.at = Math.max(this.minNow() + 15, d.at - 15); this.commit(); }, () => { d.at = Math.min(23 * 60 + 45, d.at + 15); this.commit(); }));
      edge = this.E('Next', go('meetConfirm'));
    }

    if (sc === 'meetConfirm') {
      const d = m.meetDraft[id];
      const wt = this.meetWhenTxt(d);
      add(this.T(`Meet ${P} at ${d.place}, ${wt === 'Now' ? 'now' : wt.replace('At', 'at')}.`, { size: 28, fg: '#EEF2EF' }));
      add(this.C(K.EXP[d.exp], { icon: 'clock', tone: 'muted', over: 'Expires in', pick: () => this.cycleExp('meet', id) }));
      edge = this.E('Send', () => this.sendMeet(id));
    }

    if (sc === 'meetOut') {
      const M = m.meet[id];
      add(this.H(`Meet ${P}`, !M ? '' : this.isExp(M) && !M.reply ? this.expText(M) : `${M.place}, ${M.whenTxt === 'Now' ? 'now' : M.whenTxt.replace('At', 'at')}`));
      if (M) {
        add(this.ST('You: meeting point', M.out));
        if (M.reply || !this.isExp(M)) add(this.T(M.reply ? `${P}: ${M.reply}` : 'No reply yet', { size: 24, fg: M.reply ? green : sec }));
        if (M.here) add(this.T(`${P}: here ${M.hereAt}`, { size: 24, fg: green }));
      }
    }

    if (sc === 'meetIn') {
      const M = m.meet[peer];
      if (M) {
        const when = M.whenTxt === 'Now' ? 'now' : M.whenTxt.replace('At', 'at');
        const sentence = `${P} wants to meet at ${M.place}, ${when}.`;
        const arrow = () => { if (!M.chk) add(this.AR(300 - Math.round(24 * Math.sin(m.sec / 5)), `${M.dist} m`, M.place)); };
        if (this.isExp(M) && !M.back) {
          add(this.H('Meet', this.expText(M)));
          add(this.T(sentence, { size: 28, fg: '#7F8A83' }));
        } else if (!M.back) {
          // One sentence, then answers: On my way on the edge, two more as chips. The arrow follows.
          add(this.H('Meet'));
          add(this.T(sentence, { size: 28, fg: '#EEF2EF' }));
          add(this.OPT([this.pill('In 10 min', () => this.reply(id, 'meet', 'In 10 min')), this.pill("Can't make it", () => this.reply(id, 'meet', "Can't make it"))], 'Reply'));
          arrow();
          add(this.C('More replies', { icon: 'reply', tone: 'muted', pick: () => this.openReplies(id, 'meet') }));
          edge = this.E('On my way', () => this.reply(id, 'meet', 'On my way'));
        } else {
          add(this.H('Meet', M.place));
          if (M.chk) add(this.ST("You: I'm here", M.chk));
          else add(this.ST(`You: ${M.replyText}`, M.back));
          arrow();
          if (!M.chk && M.replyText !== "Can't make it" && M.dist <= 50) edge = this.E("I'm here", () => this.imHere(id));
        }
      }
    }

    if (sc === 'hangNew') {
      const d = m.hangDraft[id];
      add(this.H('What?'));
      K.WHATS.forEach(t => add(this.C(t, { icon: 'plan', selected: !!w.picked[sc] && (d.title === t), pick: () => { w.picked[sc] = true; d.title = t; this.go(id, 'placePick'); } })));
      add(this.C('Dictate', { icon: 'mic', tone: 'muted', pick: () => this.dictate(id, 'what') }));
    }

    if (sc === 'hangWhen') {
      const d = m.hangDraft[id];
      const t0 = Math.ceil((this.minNow() + 10) / 30) * 30;
      add(this.H('When?'));
      [0, 30, 60, 90, 120, 180].map(x => t0 + x).filter(t => t < 24 * 60).forEach(t => add(this.C(`Today ${this.fmtMin(t)}`, { icon: 'clock', selected: !!w.picked[sc] && (d.time === t), pick: () => { w.picked[sc] = true; d.time = t; this.go(id, 'hangCount'); } })));
    }

    if (sc === 'hangCount') {
      const d = m.hangDraft[id];
      add(this.H('How many?'));
      K.SPOTS.forEach(n => add(this.C(`${n} spots`, { icon: 'group', selected: !!w.picked[sc] && (d.spots === n), pick: () => { w.picked[sc] = true; d.spots = n; this.go(id, 'hangWho'); } })));
    }

    if (sc === 'hangWho') {
      const d = m.hangDraft[id];
      add(this.H('Who?'));

  layout(id, rows, hasEdge) {
    const w = this.m.w[id];
    const gap = 8;
    const padTop = 76;
    // The last row rests above the bottom fade: it ends at 316 px with an edge button, 404 px without.
    const padBottom = hasEdge ? 164 : 92;
    const SAFE = 216;
    const WD = { toast: 300, state: 352, header: 340, chip: 384, big: 384, text: 352, status: 352, toggle: 384, stepper: 336, pair: 384, swatches: 368, options: 384, progress: 300, bar: 352, arrow: 220, avatar: 160, person: 320, actions: 304 };
    const maskEnd = hasEdge ? 316 : 404;
    const maskStop = hasEdge ? 362 : 452;
    // Short content sits centred above the edge button (or the fade), so no void opens above it.
    const content = rows.reduce((a, r) => a + r.h, 0) + gap * Math.max(0, rows.length - 1);
    const room = maskEnd - padTop;
    const top0 = content < room ? padTop + Math.floor((room - content) / 2) : padTop;
    let y = top0;
    let pushed = false;
    const out = rows.map(r => {
      // At rest (scroll 0) no row peeks out of the fade: one that would straddle it starts below it instead.
      r.mt = 0;
      r.y0 = y;
      if (!pushed && y < maskStop && y + r.h > maskEnd + 6 && r.h <= maskEnd - padTop) { r.mt = maskStop - y; y = maskStop; r.y0 = y; pushed = true; }
      const top = y - w.scroll;
      const bottom = top + r.h;
      const cy = top + r.h / 2;
      y += r.h + gap;
      // Only rows near the curve shrink, and never below 0.85, so text stays 17 px or larger and targets stay large.
      const dy = Math.max(Math.abs(top - 240), Math.abs(bottom - 240));
      const wd = r.wd || WD[r.kind] || 384;
      const fit = dy >= SAFE ? 0.85 : (2 * Math.sqrt(SAFE * SAFE - dy * dy)) / wd;
      const sc = Math.max(0.85, Math.min(1, fit));
      const t = Math.max(0, Math.min(1, (Math.abs(cy - 240) - 110) / 130));
      return Object.assign(r, {
        s: sc.toFixed(3), o: (1 - 0.5 * t).toFixed(3),
        isHeader: r.kind === 'header', isChip: r.kind === 'chip', isBig: r.kind === 'big', isText: r.kind === 'text',
        isToggle: r.kind === 'toggle', isStepper: r.kind === 'stepper', isPair: r.kind === 'pair', isSwatches: r.kind === 'swatches',
        isOptions: r.kind === 'options', isProgress: r.kind === 'progress', isBar: r.kind === 'bar', isArrow: r.kind === 'arrow', isAvatar: r.kind === 'avatar',
        isPerson: r.kind === 'person', isActions: r.kind === 'actions', isState: r.kind === 'state', isToast: r.kind === 'toast',

    });

    const L = 221;
    const show = total > 490;
    const thumb = show ? Math.max(34, Math.round(L * 480 / total)) : 0;
    const frac = show ? Math.max(0, Math.min(1, w.scroll / Math.max(1, total - 480))) : 0;
    const off = Math.round((L - thumb) * frac);
    return { rows: out, padBottom, padTop: top0, ind: { show, dash: `${thumb} 400`, offset: String(-off) } };
