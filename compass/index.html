<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Watch</title>
<!-- Generated by ../build-standalone.mjs from ../project/Main.dc.html. Do not edit this file: edit the source and run "node build-standalone.mjs". -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #E9EAE6; }
sc-for, sc-if { display: contents; }
button, input { font-family: 'IBM Plex Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid #4FA877; outline-offset: 2px; }
@keyframes gwBuzz { 0% { transform: translateX(0) } 50% { transform: translateX(1px) } 100% { transform: translateX(0) } }
@keyframes gwRing { 0% { opacity: 1 } 50% { opacity: 0.6 } 100% { opacity: 1 } }
@keyframes gwWave { 0% { transform: scaleY(0.3) } 50% { transform: scaleY(1) } 100% { transform: scaleY(0.3) } }
@keyframes gwFade { from { opacity: 0 } to { opacity: 1 } }
@keyframes gwSpin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
</style>
<style>
/* Standalone shell: centres the artboard and scales it to fit the window, as the canvas does. */
#dc-stage { margin: 0 auto; overflow: hidden; }
#dc-root { transform-origin: 0 0; }
#dc-fit { position: fixed; right: 12px; bottom: 12px; z-index: 2147483646; height: 32px; padding: 0 14px; border: none; border-radius: 16px; background: rgba(30, 36, 32, 0.82); color: #FFFFFF; font: 600 12px/32px system-ui, sans-serif; cursor: pointer; }
#dc-fit[hidden], #dc-error[hidden] { display: none; }
#dc-error { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 2147483647; padding: 14px 16px; border-radius: 12px; background: #3A1512; color: #FFE1DD; font: 14px/1.45 system-ui, sans-serif; white-space: pre-wrap; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/preact/10.29.6/preact.umd.js" integrity="sha384-EWMLQAo4nSqme75gBvfRF6t/lfMQmBBSVlt/tDQbExLzkAJVXGjFSsY2tIeX3px1" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div id="dc-stage"><div id="dc-root"></div></div>
<button id="dc-fit" type="button" hidden></button>
<div id="dc-error" role="alert" hidden></div>
<script type="text/x-dc-template" id="dc-template">
<div style="width: 1880px; height: 1500px; box-sizing: border-box; padding: 20px 24px; background: #E9EAE6; color: #1E2420; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

  <header style="height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em;">Garden Watch</div>
    </div>
    <div style="font-size: 15px; color: #4A524C;">Clock {{ clock }}.</div>
  </header>

  <div style="flex: 1; min-height: 0; position: relative;">

    <!-- Each watch sits at a fixed left offset, so a wrapper added by sc-for cannot change the layout. -->
    <sc-for list="{{ watches }}" as="w" hint-placeholder-count="2">
      <section aria-label="{{ w.aria }}" style="position: absolute; top: 0; left: {{ w.left }}px; width: 640px; display: flex; flex-direction: column; gap: 12px;">

        <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="width: 38px; height: 38px; border-radius: 50%; background: {{ w.avBg }}; color: {{ w.avFg }}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">{{ w.initial }}</span>
            <div>
              <div style="font-size: 18px; font-weight: 600; line-height: 1.2;">{{ w.colTitle }}</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 14px; font-size: 15px; color: #3A423C;">
            <span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ w.sigIcon }}"></path></svg>{{ w.sigName }}</span>
            <span>{{ w.battText }}</span>
          </div>
        </div>

        <!-- Galaxy Watch Ultra case, 47.1 x 47.4 mm, 1.5 inch display at 480 px. Scale: 12.6 px per mm, so the case is 594 x 597 px. -->
        <div style="position: relative; width: 624px; height: 637px; margin-left: 8px; flex: none;">
          <div aria-hidden="true" style="position: absolute; left: 162px; top: 0; width: 300px; height: 637px; border-radius: 30px; background: #26292A;"></div>
          <div aria-hidden="true" style="position: absolute; left: 15px; top: 20px; width: 594px; height: 597px; box-sizing: border-box; border-radius: 156px; background: #B3B6B3; box-shadow: 0 8px 20px rgba(0,0,0,0.12);"></div>
          <div aria-hidden="true" style="position: absolute; left: 40px; top: 47px; width: 544px; height: 544px; border-radius: 50%; background: #9C9F9C;"></div>
          <div aria-hidden="true" style="position: absolute; left: 52px; top: 59px; width: 520px; height: 520px; border-radius: 50%; background: #070808;"></div>

          <!-- Right side, top to bottom: Home key 150 to 242, orange Quick button 267 to 371, Back key 396 to 488. Case centre is y 319. The case edge runs straight from 176 to 461 and has moved in under 3 px at the key ends. -->
          <button onClick="{{ w.homeKey }}" aria-label="Home key" title="Home key: watch face, then apps" style="position: absolute; left: 594px; top: 146px; width: 44px; height: 100px; padding: 0; border: none; background: transparent;">
            <span aria-hidden="true" style="position: absolute; left: 10px; top: 4px; width: 15px; height: 92px; border-radius: 7px; background: #A3A6A3;"></span>
          </button>
          <button onPointerDown="{{ w.quickDown }}" onPointerUp="{{ w.quickUp }}" onPointerLeave="{{ w.quickUp }}" aria-label="Quick button: hold to talk on Cabin 3, or tap to talk for 4 seconds" title="Quick button: hold to talk on Cabin 3, or tap to talk for 4 s" style="position: absolute; left: 594px; top: 263px; width: 44px; height: 112px; padding: 0; border: none; background: transparent; touch-action: none;">
            <span aria-hidden="true" style="position: absolute; left: 10px; top: 4px; width: 15px; height: 104px; border-radius: 7px; background: {{ w.quickBg }};"></span>
          </button>
          <button onClick="{{ w.backKey }}" aria-label="Back key" title="Back key: one screen back" style="position: absolute; left: 594px; top: 392px; width: 44px; height: 100px; padding: 0; border: none; background: transparent;">
            <span aria-hidden="true" style="position: absolute; left: 10px; top: 4px; width: 15px; height: 92px; border-radius: 7px; background: #A3A6A3;"></span>
          </button>

          <div style="position: absolute; left: 72px; top: 79px; width: 480px; height: 480px; border-radius: 50%; overflow: hidden; background: #000000; color: #EEF2EF; font-family: 'IBM Plex Sans', sans-serif; animation: {{ w.anim }};">

            <!-- Watch face: time, date and up to four complications, each shown only when it has something to say -->
            <sc-if value="{{ w.s.face }}" hint-placeholder-val="{{ true }}">
              <sc-if value="{{ w.face.hasNext }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ w.face.nextPick }}" aria-label="{{ w.face.nextAria }}" style="position: absolute; left: 120px; top: 70px; width: 240px; height: 44px; padding: 0; border: none; border-radius: 22px; background: transparent; color: #DDE5DF; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{ w.ic.plan }}"></path></svg>
                  <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ w.face.next }}</span>
                </button>
              </sc-if>
              <button onClick="{{ w.openApps }}" aria-label="Open Garden" style="position: absolute; left: 90px; top: 116px; width: 300px; height: 110px; padding: 0; border: none; background: transparent; color: #F4F7F4; font-size: 104px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">{{ w.face.time }}</button>
              <div style="position: absolute; left: 90px; top: 228px; width: 300px; text-align: center; font-size: 24px; color: #B4BEB7;">Sat 4 Oct</div>
              <div style="position: absolute; left: 70px; top: 296px; width: 340px; display: flex; justify-content: center; gap: 14px;">
                <sc-for list="{{ w.face.comps }}" as="c" hint-placeholder-count="2">
                  <div style="width: 88px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
                    <button onClick="{{ c.pick }}" aria-label="{{ c.aria }}" style="position: relative; width: 72px; height: 72px; padding: 0; border: none; border-radius: 50%; background: {{ c.bg }}; color: {{ c.fg }}; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600;">
                      <sc-if value="{{ c.isInitial }}" hint-placeholder-val="{{ false }}">
                        <span>{{ c.initial }}</span>
                      </sc-if>
                      <sc-if value="{{ c.isBars }}" hint-placeholder-val="{{ false }}">
                        <span aria-hidden="true" style="display: flex; align-items: center; gap: 4px; height: 28px;">
                          <span style="width: 5px; height: 26px; border-radius: 3px; background: currentColor; animation: gwWave 1s ease-in-out 0s infinite;"></span>
                          <span style="width: 5px; height: 26px; border-radius: 3px; background: currentColor; animation: gwWave 1s ease-in-out 0.25s infinite;"></span>
                          <span style="width: 5px; height: 26px; border-radius: 3px; background: currentColor; animation: gwWave 1s ease-in-out 0.5s infinite;"></span>
                        </span>
                      </sc-if>
                      <sc-if value="{{ c.isIcon }}" hint-placeholder-val="{{ false }}">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.d }}"></path></svg>
                      </sc-if>
                    </button>
                    <span style="font-size: 18px; color: #C9D2CB; max-width: 88px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ c.label }}</span>
                  </div>
                </sc-for>
              </div>
              <div style="position: absolute; left: 90px; top: 262px; width: 300px; text-align: center; font-size: 22px; line-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{ w.face.lineColor }};">{{ w.face.line }}</div>
              <!-- Present switch. On means nobody reaches you. -->
              <button onClick="{{ w.togglePresent }}" aria-label="{{ w.presentAria }}" style="position: absolute; left: 150px; top: {{ w.presentTop }}px; width: 180px; height: 48px; padding: 0; border: none; border-radius: 24px; background: {{ w.presentBg }}; color: {{ w.presentFg }}; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ w.ic.present }}"></path></svg>
                <span>{{ w.presentLabel }}</span>
              </button>
            </sc-if>

            <!-- Generic Wear OS list: scales and fades toward the edges -->
            <sc-if value="{{ w.isList }}" hint-placeholder-val="{{ false }}">
              <div key="{{ w.listKey }}" onScroll="{{ w.onScroll }}" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; box-sizing: border-box; padding: {{ w.padTop }}px 48px {{ w.padBottom }}px; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; align-items: center; gap: 8px; -webkit-mask-image: linear-gradient(to bottom, transparent 62px, #000000 84px, #000000 {{ w.maskEnd }}px, transparent {{ w.maskStop }}px); mask-image: linear-gradient(to bottom, transparent 62px, #000000 84px, #000000 {{ w.maskEnd }}px, transparent {{ w.maskStop }}px);">
                <sc-for list="{{ w.rows }}" as="r" hint-placeholder-count="4">
                  <div style="width: 384px; min-height: {{ r.h }}px; margin-top: {{ r.mt }}px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: scale({{ r.s }}); opacity: {{ r.o }};">

                    <sc-if value="{{ r.isHeader }}" hint-placeholder-val="{{ false }}">
                      <div style="font-size: 28px; font-weight: 600; color: #E6ECE7; text-align: center; line-height: 1.2; max-width: 340px;">{{ r.text }}</div>
                      <sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ false }}">
                        <div style="font-size: 22px; color: #B4BEB7; text-align: center; margin-top: 4px;">{{ r.sub }}</div>
                      </sc-if>
                    </sc-if>

                    <sc-if value="{{ r.isChip }}" hint-placeholder-val="{{ true }}">
                      <button onClick="{{ r.pick }}" aria-label="{{ r.aria }}" aria-disabled="{{ r.disabled }}" style="opacity: {{ r.chipOp }}; cursor: {{ r.cursor }}; width: 384px; height: 88px; border: none; border-radius: 44px; background: {{ r.bg }}; color: {{ r.fg }}; display: flex; align-items: center; gap: 16px; padding: 0 32px; box-sizing: border-box; text-align: left;">
                        <sc-if value="{{ r.hasIcon }}" hint-placeholder-val="{{ false }}">
                          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{ r.d }}"></path></svg>
                        </sc-if>
                        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                          <sc-if value="{{ r.hasOver }}" hint-placeholder-val="{{ false }}">
                            <span style="font-size: 20px; color: {{ r.subFg }}; line-height: 1.2; white-space: nowrap;">{{ r.over }}</span>
                          </sc-if>
                          <span style="font-size: {{ r.labelSize }}px; font-weight: 600; line-height: 1.1; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;">{{ r.label }}</span>
                          <sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ false }}">
                            <span style="font-size: 20px; color: {{ r.subFg }}; line-height: 1.15; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;">{{ r.sub }}</span>
                          </sc-if>
                        </span>
                        <sc-if value="{{ r.hasTrail }}" hint-placeholder-val="{{ false }}">
                          <span style="flex: none; font-size: 22px; font-weight: 600; color: {{ r.trailFg }};">{{ r.trail }}</span>
                        </sc-if>
                        <sc-if value="{{ r.selected }}" hint-placeholder-val="{{ false }}">
                          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{ r.checkD }}"></path></svg>
                        </sc-if>
                      </button>
                    </sc-if>

                    <sc-if value="{{ r.isBig }}" hint-placeholder-val="{{ false }}">
                      <div style="font-size: {{ r.size }}px; font-weight: 600; color: {{ r.fg }}; text-align: center; line-height: 1.12; max-width: 384px; font-variant-numeric: tabular-nums;">{{ r.text }}</div>
                    </sc-if>

                    <sc-if value="{{ r.isText }}" hint-placeholder-val="{{ false }}">
                      <div style="font-size: {{ r.size }}px; color: {{ r.fg }}; text-align: center; line-height: 1.3; max-width: 352px; text-wrap: pretty;">{{ r.text }}</div>
                    </sc-if>


                    <sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ false }}">
                      <button onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" aria-label="{{ r.aria }}" style="width: 384px; height: 88px; border: none; border-radius: 44px; background: #1E2622; color: #EEF2EF; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 32px; box-sizing: border-box; text-align: left;">
                        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                          <span style="font-size: 26px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.label }}</span>
                          <sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ false }}">
                            <span style="font-size: 20px; color: #B4BEB7; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.sub }}</span>
                          </sc-if>
                        </span>
                        <span aria-hidden="true" style="width: 64px; height: 36px; border-radius: 18px; background: {{ r.track }}; display: flex; align-items: center; flex: none;">
                          <span style="width: 26px; height: 26px; border-radius: 50%; background: {{ r.knob }}; margin-left: {{ r.knobX }}px; transition: margin-left 0.15s ease;"></span>
                        </span>
                      </button>
                    </sc-if>

                    <sc-if value="{{ r.isStepper }}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
                        <div style="font-size: 22px; color: #B4BEB7;">{{ r.label }}</div>
                        <div style="display: flex; align-items: center; gap: 18px;">
                          <button onClick="{{ r.dec }}" aria-label="{{ r.decAria }}" style="width: 80px; height: 80px; padding: 0; border: none; border-radius: 50%; background: #1E2622; color: #EEF2EF; display: flex; align-items: center; justify-content: center;">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{ r.minusD }}"></path></svg>
                          </button>
                          <span style="min-width: 140px; text-align: center; font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums;">{{ r.value }}</span>
                          <button onClick="{{ r.inc }}" aria-label="{{ r.incAria }}" style="width: 80px; height: 80px; padding: 0; border: none; border-radius: 50%; background: #1E2622; color: #EEF2EF; display: flex; align-items: center; justify-content: center;">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{ r.plusD }}"></path></svg>
                          </button>
                        </div>
                      </div>
                    </sc-if>

                    <sc-if value="{{ r.isPair }}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; gap: 16px;">
                        <button onClick="{{ r.a.pick }}" aria-label="{{ r.a.aria }}" style="width: 184px; height: 104px; padding: 0 12px; border: none; border-radius: 52px; background: {{ r.a.bg }}; color: {{ r.a.fg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
                          <span style="font-size: 28px; font-weight: 600; line-height: 1.15;">{{ r.a.label }}</span>
                          <sc-if value="{{ r.a.hasSub }}" hint-placeholder-val="{{ false }}">
                            <span style="font-size: 18px; line-height: 1.2; white-space: nowrap;">{{ r.a.sub }}</span>
                          </sc-if>
                        </button>
                        <button onClick="{{ r.b.pick }}" aria-label="{{ r.b.aria }}" style="width: 184px; height: 104px; padding: 0 12px; border: none; border-radius: 52px; background: {{ r.b.bg }}; color: {{ r.b.fg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
                          <span style="font-size: 28px; font-weight: 600; line-height: 1.15;">{{ r.b.label }}</span>
                          <sc-if value="{{ r.b.hasSub }}" hint-placeholder-val="{{ false }}">
                            <span style="font-size: 18px; line-height: 1.2; white-space: nowrap;">{{ r.b.sub }}</span>
                          </sc-if>
                        </button>
                      </div>
                    </sc-if>

                    <sc-if value="{{ r.isSwatches }}" hint-placeholder-val="{{ false }}">
                      <div role="group" aria-label="Avatar colour" style="display: flex; gap: 12px;">
                        <sc-for list="{{ r.items }}" as="sw" hint-placeholder-count="5">
                          <button onClick="{{ sw.pick }}" aria-label="{{ sw.aria }}" aria-pressed="{{ sw.pressed }}" style="width: 64px; height: 64px; padding: 0; border: none; border-radius: 50%; background: {{ sw.bg }}; color: {{ sw.fg }}; font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{ sw.mark }}</button>
                        </sc-for>
                      </div>
                    </sc-if>

                    <sc-if value="{{ r.isOptions }}" hint-placeholder-val="{{ false }}">
                      <div role="group" aria-label="{{ r.groupAria }}" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 384px;">
                        <sc-for list="{{ r.items }}" as="op" hint-placeholder-count="6">
                          <button onClick="{{ op.pick }}" aria-label="{{ op.label }}" aria-pressed="{{ op.pressed }}" style="height: {{ r.pillH }}px; padding: 0 24px; border: none; border-radius: {{ r.pillR }}px; background: {{ op.bg }}; color: {{ op.fg }}; font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                            <sc-if value="{{ op.selected }}" hint-placeholder-val="{{ false }}">
                              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ op.checkD }}"></path></svg>
                            </sc-if>
                            <span>{{ op.label }}</span>
                          </button>
                        </sc-for>
                      </div>
                    </sc-if>

                    <sc-if value="{{ r.isProgress }}" hint-placeholder-val="{{ false }}">
                      <div style="width: 300px; height: 12px; border-radius: 6px; background: #26302A; overflow: hidden;">
                        <div style="height: 12px; width: {{ r.w }}px; border-radius: 6px; background: #8FE3B0;"></div>
                      </div>
                    </sc-if>

                    <sc-if value="{{ r.isBar }}" hint-placeholder-val="{{ false }}">
                      <div style="width: 352px; display: flex; align-items: center; gap: 14px;">
                        <span style="width: 96px; font-size: 24px; font-weight: 600; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ r.label }}</span>
                        <span style="flex: 1; height: 16px; border-radius: 8px; background: #26302A; overflow: hidden; display: flex;">
                          <span style="height: 16px; width: {{ r.w }}px; border-radius: 8px; background: #8FE3B0; transition: width 0.4s ease;"></span>
                        </span>
                        <span style="width: 36px; text-align: right; font-size: 24px; font-variant-numeric: tabular-nums;">{{ r.count }}</span>
                      </div>
                    </sc-if>

                    <sc-if value="{{ r.isArrow }}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; align-items: center; gap: 18px;">
                        <svg width="68" height="68" viewBox="0 0 120 120" aria-hidden="true" style="transform: rotate({{ r.deg }}deg); transition: transform 1s linear;"><path d="M60 8L98 106L60 84L22 106Z" fill="#8FE3B0"></path></svg>
                        <span style="display: flex; flex-direction: column;">
                          <span style="font-size: 38px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums;">{{ r.dist }}</span>
                          <sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ false }}">
                            <span style="font-size: 20px; color: #B4BEB7; line-height: 1.25; white-space: nowrap;">{{ r.sub }}</span>
                          </sc-if>
                        </span>
                      </div>
                    </sc-if>

                    <sc-if value="{{ r.isToast }}" hint-placeholder-val="{{ false }}">

      draft: { you: null, maya: null },
      meetDraft: { you: { place: 'The Lake', when: 0, at: 18 * 60, exp: 0 }, maya: { place: 'The Lake', when: 0, at: 18 * 60, exp: 0 } },
      hangDraft: { you: hang(), maya: hang() },
      pollDraft: { you: poll(), maya: poll() },
      ptt: null,
      pttHeard: false,
      inbox: { you: [], maya: [] },
      log: [],
      logMode: 'plain',
      lastPing: { you: null, maya: null },
      callNote: '',
    };
  }

  freshWatch(id) {
    return {
      id, screen: 'face', stack: [], signal: 'lte', lowBatt: false, lowPower: false, dnd: false, status: 'Free', until: '',
      anim: 'none', toast: '', toastStamp: 0, hap: null, rec: null, lastRec: null, torch: 'red', compassBad: false, fallback: 'calibrate',
      lastSeen: '', scroll: 0, color: id === 'you' ? 0 : 1, quietOn: true, quietStart: 23 * 60, quietEnd: 7 * 60 + 30, listed: true,
      replyCtx: 'ping', quickPressed: false, talkAuto: false,
      headphones: true, music: { pl: 'walk', track: 0, playing: false, vol: 6, pausedBy: '', blocked: false },
      navTarget: '', placeSel: '', gm: { dest: '', mins: 0, step: 0, stepSec: 0, active: false, arrived: false },
      cal: this.K.CAL[id].map(c => ({ t: c[0], title: c[1], place: c[2], remindAt: c[0] - 10, fired: false, dismissed: false })), calSynced: '17:30', remindIdx: -1,
      recs: id === 'you'
        ? [{ id: 'r1', when: 'Today 09:10', len: 2530, marks: [312, 1504, 2210], exp: '' }, { id: 'r2', when: 'Yesterday 21:30', len: 3900, marks: [], exp: 'done' }]
        : [{ id: 'r3', when: 'Yesterday 18:05', len: 1260, marks: [400], exp: '' }],
      recSel: '', recPlay: { playing: false, pos: 0 },
      channel: 'cabin', groupSel: '', groupDraft: { name: 0, title: 'Lake walk', withPeer: true, end: 0, now: false },
      wallet: 'ready', walletAt: '', friendState: 'idle',
      memoText: true, nowFriends: true, fromSum: false, held: [], sumIdx: 0, picked: {}, present: false, presentWas: false, sumTimes: [12 * 60, 19 * 60], pending: [], summary: null, sumDue: false, lastMin: null,
      favs: ['Mum', 'Dad'], favQuiet: false, call: null,
      levels: [0.2, 0.3, 0.25, 0.4, 0.3, 0.2, 0.35, 0.3, 0.2, 0.25, 0.3, 0.2, 0.3, 0.25],
    };
  }

  /* ---------- timers and helpers ---------- */

  startTick() {
    if (this.tickId) return;
    this.tickId = setInterval(() => this.tick(), 1000);
  }

  stopAll() {
    this.timers.forEach(t => clearTimeout(t));
    this.timers.clear();
    ['you', 'maya'].forEach(id => { this.clearLevel(id); this.stopPlayTimer(id); });
    if (this.holdId) { clearTimeout(this.holdId); this.holdId = null; }
    this.backTimers = { you: null, maya: null };
  }

  later(ms, fn) {
    const t = setTimeout(() => { this.timers.delete(t); fn(); }, ms);
    this.timers.add(t);
    return t;
  }

  commit() {
    if (this.m && this.m.w) ['you', 'maya'].forEach(id => { this.presentCheck(id); this.prunePending(id); });
    this.ver += 1;
    this.setState({ v: this.ver });
  }

  reset() {
    const names = this.m.names;
    const story = this.m.story;
    this.stopAll();
    this.jobs = [];
    this.pttLatched = false;
    this.pttLatchId = null;
    this.backTimers = { you: null, maya: null };
    this.m = this.fresh();
    this.m.names = names;
    this.m.story = story;
    this.initHeard();
    this.commit();
  }

  pad(n) { return String(n).padStart(2, '0'); }

  fmt(sec, withSeconds) {
    const t = ((this.K.START + sec) % 86400 + 86400) % 86400;
    const h = Math.floor(t / 3600);
    const mi = Math.floor((t % 3600) / 60);
    const s = t % 60;
    return withSeconds ? `${this.pad(h)}:${this.pad(mi)}:${this.pad(s)}` : `${this.pad(h)}:${this.pad(mi)}`;
  }

  now() { return this.fmt(this.m.sec); }

  minNow() {
    const t = ((this.K.START + this.m.sec) % 86400 + 86400) % 86400;
    return Math.floor(t / 60);
  }

  fmtMin(min) {
    const x = ((min % 1440) + 1440) % 1440;
    return `${this.pad(Math.floor(x / 60))}:${this.pad(x % 60)}`;
  }

  dur(sec) {
    const s = Math.max(0, Math.round(sec));
    const h = Math.floor(s / 3600);
    const mi = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    return h ? `${h}:${this.pad(mi)}:${this.pad(ss)}` : `${mi}:${this.pad(ss)}`;
  }

  ago(sec) { return sec < 60 ? `${sec} s ago` : `${Math.floor(sec / 60)} min ago`; }

  other(id) { return id === 'you' ? 'maya' : 'you'; }

  nm(id) {
    if (id === 'you' || id === 'maya') {
      const n = String(this.m.names[id] || '').trim();
      return n || (id === 'you' ? 'Host' : 'Maya');
    }
    return id;
  }

  sigOf(id) { return this.m.w[id] ? this.m.w[id].signal : 'lte'; }

  inWindow(s, e, t) {
    if (s === e) return false;
    return s < e ? (t >= s && t < e) : (t >= s || t < e);
  }

  quietKind(id) {
    const w = this.m.w[id];
    if (!w) return '';
    if (w.dnd) return 'dnd';
    if (w.status !== 'Free') return 'status';
    if (w.quietOn && this.inWindow(w.quietStart, w.quietEnd, this.minNow())) return 'hours';
    return '';
  }

  isQuiet(id) { return !!this.quietKind(id); }

  // Present: the owner is with people. Set by the face shortcut, a joined hang's time, or recording.
  hangNow(id) {
    const t = this.minNow();
    const mine = this.m.hang[id];
    const theirs = this.m.hang[this.other(id)];
    const on = (H) => H && t >= H.time && t < H.time + this.K.HANG_LEN;
    if (mine && !mine.withdrawn && on(mine)) return mine;
    if (theirs && theirs.confirmed && theirs.answer === 'in' && on(theirs)) return theirs;
    return null;
  }

  // Present has three causes, tracked apart: manual (the face switch), hang and recording.
  presentSocial(id) {
    const w = this.m.w[id];
    return !!(w && (w.present || this.hangNow(id)));
  }

  isPresent(id) {
    const w = this.m.w[id];
    return !!(w && (this.presentSocial(id) || w.rec));
  }

  // The reason line under the face's switch, for causes the switch doesn't control.
  presentReason(id) {
    const w = this.m.w[id];
    const H = this.hangNow(id);
    if (w.rec) return 'Recording';
    if (H) return `Hang until ${this.fmtMin(H.time + this.K.HANG_LEN)}`;
    return '';
  }

  presentText(id) {
    return this.presentReason(id) || 'Present';
  }

  presentCheck(id) {
    const w = this.m.w[id];
    const now = this.isPresent(id);
    if (now === w.presentWas) return;
    w.presentWas = now;
    if (now) return;
    // Release, once, when the last cause ends: run the attention table on each held arrival.
    const held = w.held;
    w.held = [];
    held.forEach(h => {
      const it = this.inboxItem(h);
      if (it && this.isExp(it)) return;
      const social = h.key === 'memo' || h.key === 'poll' || h.key === 'group';
      if (social && !w.nowFriends) {
        if (it) it.held = true;
        this.holdForSummary(id, { key: h.key, owner: h.owner, title: h.title, from: this.nm(h.owner), screen: h.screen, gid: h.gid || '' });
        return;
      }
      if (this.isQuiet(id)) { this.haptic(id, 'quiet'); this.holdForSummary(id, { key: h.key, owner: h.owner, title: h.title, from: h.key === 'ann' ? 'The Garden' : this.nm(h.owner), screen: h.screen, gid: h.gid || '' }); return; }
      this.haptic(id, h.pattern);
      if (h.gid) w.groupSel = h.gid;
      this.go(id, h.screen);
    });
    this.later(300, () => { this.fireReminders(id); this.commit(); });
    if (w.sumDue) { w.sumDue = false; this.later(1500, () => this.fireSummary(id)); }
  }

  togglePresent(id) {
    const w = this.m.w[id];
    w.present = !w.present;
    this.haptic(id, 'tick');
    this.sendStatus(id);
    this.commit();
  }

  quietText(id) {
    const w = this.m.w[id];
    const k = this.quietKind(id);
    if (k === 'dnd') return `Do not disturb until ${w.until}`;
    if (k === 'status') return `${w.status} until ${w.until}`;
    if (k === 'hours') return `Quiet hours until ${this.fmtMin(w.quietEnd)}`;
    return '';
  }

  quietSentence(id) {
    const w = this.m.w[id];
    const n = this.nm(id);
    const k = this.quietKind(id);
    if (k === 'dnd') return `${n} has do not disturb on until ${w.until}`;
    if (k === 'status') return `${n} is ${w.status.toLowerCase()} until ${w.until}`;
    if (k === 'hours') return `${n} has quiet hours on until ${this.fmtMin(w.quietEnd)}`;
    return '';
  }

  blob() {
    const h = () => Math.floor(Math.random() * 65536).toString(16).padStart(4, '0');
    return `${h()}…${h()}`;
  }

  deleteBy(ttl) {
    if (ttl >= 1440) return `${Math.round(ttl / 1440)} d`;
    return this.fmtMin(Math.ceil((this.minNow() + ttl) / 10) * 10);
  }

  // What the server log calls each kind of item, in plain mode.
  kindOf(what) {
    const K = [['ping', 'a nudge'], ['memo', 'a memo'], ['delivery receipt', 'a delivery receipt'], ['read receipt', 'a read receipt'], ['cancel confirmed', 'a confirmation'], ['cancel', 'a cancel'],
      ['location request', 'a location request'], ['location fix', 'a location'], ['location answer', 'an answer'], ['sharing ended', 'a stop'], ['quick reply', 'a reply'], ['meeting point', 'a meeting point'],
      ['"I\'m here"', 'a check-in'], ['hang invite', 'an invite'], ['hang answer', 'an answer'], ['hang confirmation', 'a confirmation'], ['poll', 'a poll'], ['vote', 'a vote'],
      ['announcement', 'an announcement'], ['status', 'a status'], ['group invite', 'a group invite'], ['group answer', 'an answer']];
    const hit = K.find(k => String(what || '').startsWith(k[0]));
    return hit ? hit[1] : 'a message';
  }

  isReceipt(what) { return /receipt|cancel confirmed/.test(String(what || '')); }

  log(r) {
    const row = { id: ++this.seq, t: this.fmt(this.m.sec, true), plain: r.receipt ? '' : (r.plain || ''), tech: r.tech || '', inside: r.inside || '' };
    this.m.log.unshift(row);
    if (this.m.log.length > 90) this.m.log.length = 90;
  }

  haptic(id, kind) {
    const w = this.m.w[id];
    if (!w) return;
    if (['ping', 'memo', 'invite', 'here', 'reply', 'remind'].indexOf(kind) >= 0 && this.isPresent(id)) return;
    const p = this.K.PAT[kind];
    if (p) {
      const stamp = ++this.seq;
      w.hap = { kind, time: this.now(), stamp, active: true };
      this.later(2200, () => { if (w.hap && w.hap.stamp === stamp) { w.hap.active = false; this.commit(); } });
    }
    const anim = p ? p.anim : 'none';
    w.anim = 'none';
    this.commit();
    if (anim !== 'none') {
      this.later(30, () => { w.anim = anim; this.commit(); });
      this.later(1700, () => { if (w.anim === anim) { w.anim = 'none'; this.commit(); } });
    }
  }

  // Receipts never buzz. A tick plays only while the sender is looking at that item.
  receiptTick(id, key) {
    const ON = { ping: ['pingOut'], memo: ['memoOut', 'memos'], loc: ['askOut'], meet: ['meetOut'], hang: ['hangHost', 'hangIn'], poll: ['pollHost', 'pollIn'], ann: ['annOut'], grp: ['groupHost'] };
    if ((ON[key] || []).indexOf(this.m.w[id].screen) >= 0) this.haptic(id, 'tick');
  }

  toast(id, text) {
    const w = this.m.w[id];
    w.toast = text;
    const stamp = ++this.seq;
    w.toastStamp = stamp;
    this.later(2600, () => { if (w.toastStamp === stamp) { w.toast = ''; this.commit(); } });
    this.commit();
  }

  waitingCount(id) {
    return this.jobs.filter(j => !j.dead && j.from === id && j.stage === 'upload' && !j.fix && !String(j.what).startsWith('status')).length;
  }

  /* ---------- delivery engine (spec section 4) ---------- */

  send(o) {
    const job = Object.assign({ stage: 'upload', blob: this.blob(), receipt: true, dead: false, ttl: 30, prio: 'high', size: '512 B' }, o);
    if (job.track) this.track(job, { state: 'saved', wait: '' });
    this.later(job.track ? 800 : 250, () => this.step(job));
    return job;
  }

  track(job, patch) {
    const t = job.track;
    if (!t) return;
    const bag = this.m[t.key];
    const it = bag ? bag[t.owner] : null;
    if (!it || it.id !== t.id) return;
    if (!it[t.slot]) it[t.slot] = { state: 'none' };
    const st = it[t.slot];
    const R = this.K.RANK;
    const p = Object.assign({}, patch);
    if (p.state && R[p.state] < R[st.state]) { delete p.state; delete p.wait; }
    if (!p.state && p.wait && R[st.state] >= 3) delete p.wait;
    if (p.state === 'queued') st.wasQueued = true;
    Object.assign(st, p);
  }

  hold(job, patch) {
    if (job.fix) { job.dead = true; return; }
    this.track(job, patch);
    if (this.jobs.indexOf(job) < 0) this.jobs.push(job);
    this.commit();
  }

  pump() {
    const js = this.jobs.filter(j => !j.dead);
    this.jobs = [];
    js.forEach((j, i) => this.later(300 + i * 250, () => this.step(j)));
  }

  blocker(job) {
    const t = this.m.w[job.to];
    if (!t) return null;
    const B = this.nm(job.to);
    if (t.signal === 'none') {
      return {
        wait: `Waiting for ${B}'s watch`,
        plain: `Held for ${B}.`,
        tech: `no check-in from ${B} since ${t.lastSeen}`,
      };
    }
    if (job.memo && t.lowPower) {
      return {
        wait: `${B}'s watch is in low-power mode`,
        plain: `Held for ${B}.`,
        tech: 'normal priority, recipient in low-power mode',
      };
    }
    return null;
  }

  step(job) {
    if (job.dead) return;
    const A = this.nm(job.from);
    const B = this.nm(job.to);
    const queuedWait = '';
    if (job.stage === 'upload') {
      if (this.sigOf(job.from) === 'none') { this.hold(job, { state: 'queued', wait: queuedWait }); return; }
      this.later(900, () => {
        if (job.dead) return;
        if (this.sigOf(job.from) === 'none') { this.hold(job, { state: 'queued', wait: queuedWait }); return; }
        this.log({
          plain: `${A} sent ${B} ${this.kindOf(job.what)}.`, receipt: this.isReceipt(job.what),
          tech: `UPLOAD ${A} → server | ${job.size} | push ${job.prio} | delete-by ${this.deleteBy(job.ttl)} | ${job.blob}`,
          inside: `Only the watches can read: ${job.what}`,
        });
        this.track(job, { state: 'sent', wait: '' });
        if (job.onSent) job.onSent();
        job.stage = 'fetch';
        this.commit();
        this.later(250, () => this.step(job));
      });
      return;
    }
    if (job.stage === 'fetch') {
      const why = this.blocker(job);
      if (why) {
        if (!job.heldLogged) {
          job.heldLogged = true;
          this.log({ plain: why.plain, tech: `HOLD server → ${B} | ${job.blob} | ${why.tech}` });
        }
        this.hold(job, { wait: why.wait });
        return;
      }
      this.later(1100, () => {
        if (job.dead) return;
        if (this.blocker(job)) { this.step(job); return; }
        const quiet = !!job.quietable && this.isQuiet(job.to);
        const qs = quiet ? this.quietSentence(job.to) : '';
        this.log({ plain: `${B}'s watch picked it up.`, receipt: this.isReceipt(job.what), tech: `DELIVER server → ${B} | ${job.size} | fetched, deleted | ${job.blob}` });
        if (job.onArrive) job.onArrive(quiet);
        if (job.track && job.receipt) {
          this.send({
            from: job.to, to: job.from, what: 'delivery receipt', ttl: 60, prio: 'normal', receipt: false,
            onArrive: () => {
              const t = job.track;
              const it = t.key === 'grp' ? this.m.grp[t.owner] : (this.m[t.key] || {})[t.owner];
              const pending = !!(job.later && it && it.held);
              const present = this.heardPresent(job.from);
              this.track(job, { state: 'delivered', quiet: quiet || !!job.later || present, wait: pending ? `In ${B}'s next summary` : present ? `${B} is present. It waits.` : quiet ? `No buzz. ${qs}.` : '' });
              if (job.onDelivered) job.onDelivered();
              this.receiptTick(job.from, job.track.key);
              this.commit();
            },
          });
        }
        this.commit();
      });
    }
  }

  fanout(id, what) {
    if (this.sigOf(id) === 'none') return;
    const A = this.nm(id);
    this.log({
      plain: `${A} sent ${this.kindOf(what)} to 5 people.`,
      tech: `UPLOAD ${A} → server | 5 × 512 B | fan-out to listed members`,
      inside: `Only the watches can read: ${what}`,
    });
  }

  simDeliver(owner, name, what, fn) {
    if (this.sigOf(owner) === 'none') { this.later(1000, () => this.simDeliver(owner, name, what, fn)); return; }
    const B = this.nm(owner);
    this.log({
      plain: `${name} sent ${B} ${this.kindOf(what)}.`,
      tech: `UPLOAD ${name} → server | 512 B | simulated member | ${this.blob()}`,
      inside: `Only the watches can read: ${what}`,
    });
    this.later(700, () => {
      this.log({ plain: `${B}'s watch picked it up.`, tech: `DELIVER server → ${B} | 512 B | fetched, deleted` });
      fn();
      this.commit();
    });
    this.commit();
  }

  /* ---------- arrivals and navigation ---------- */

  arrive(id, key, owner, title, screen, pattern) {
    const quiet = this.isQuiet(id);
    const from = key === 'ann' ? 'The Garden' : this.nm(owner);
    this.m.inbox[id] = this.m.inbox[id].filter(e => !(e.key === key && e.owner === owner));
    this.m.inbox[id].unshift({ key, owner, title, from, screen, time: this.now(), unread: true, quiet });
    if (this.isPresent(id)) {
      this.m.w[id].held.push({ key, owner, title, screen, pattern, gid: key === 'group' ? this.m.w[id].groupSel : '' });
      return;
    }
    if (quiet) {
      this.haptic(id, 'quiet');
      this.holdForSummary(id, { key, owner, title, from, screen, gid: key === 'group' ? this.m.w[id].groupSel : '' });
      return;
    }
    this.haptic(id, pattern);
    this.go(id, screen);
  }

  // A Later item reaches the watch silently and waits for the next summary.
  holdForSummary(id, item) {
    const it = item.key === 'group' ? this.m.grp[item.gid] : this.inboxItem(item);
    this.m.w[id].pending.push(Object.assign({ time: this.now(), iid: it && it.id !== undefined ? it.id : null, dismissed: false }, item));
    this.commit();
  }

  // F11: an item leaves pending only when it is played, answered or dismissed. Paging a
  // snapshot with Next, the Back key or Close changes nothing. A replaced or expired item is gone.
  itemDone(x) {
    if (x.dismissed) return true;
    const it = x.key === 'group' ? this.m.grp[x.gid] : this.inboxItem(x);
    if (x.key === 'call' || x.key === 'remind' || x.key === 'ann') return false;
    if (!it || (x.iid !== null && it.id !== x.iid)) return true;
    if (this.isExp(it) && !this.inboxAnswered(x, it)) return true;
    if (x.key === 'memo') return !!it.heard;
    if (x.key === 'poll') return !!it.peerVote;
    if (x.key === 'group') return it.peerState !== 'invited';
    if (x.key === 'ping' || x.key === 'meet') return !!it.back;
    if (x.key === 'hang') return !!it.answer;
    if (x.key === 'loc') return !!it.peerChoice;
    return false;
  }

  prunePending(id) {
    const w = this.m.w[id];
    if (w.pending.some(x => this.itemDone(x))) w.pending = w.pending.filter(x => !this.itemDone(x));
  }

  // After a vote, a reply or a played memo opened from a snapshot, go back to it and move on.
  sumReturn(id) {
    const w = this.m.w[id];
    if (!w.fromSum) return;
    w.fromSum = false;
    this.later(1200, () => {
      const top = w.stack[w.stack.length - 1];
      if (top !== 'sumItem') return;
      this.back(id);
      this.sumNext(id);
    });
  }

  sumDismiss(id, x) {
    x.dismissed = true;
    this.sumNext(id);
  }

  // The summary notification names what waited, with no numbers.
  sumText(items) {
    const has = (k) => items.filter(x => x.key === k).length;
    const KIND = [['ping', 'a nudge', 'nudges'], ['meet', 'a meeting point', 'meeting points'], ['hang', 'an invite', 'invites'], ['ann', 'an announcement', 'announcements'], ['memo', 'a memo', 'memos'], ['poll', 'a poll', 'polls'], ['group', 'a group invite', 'group invites'], ['remind', 'a reminder', 'reminders'], ['call', 'a missed call', 'missed calls']];
    const parts = KIND.filter(k => has(k[0])).map(k => (has(k[0]) === 1 ? k[1] : k[2]));
    const txt = parts.length > 1 ? `${parts.slice(0, -1).join(', ')} and ${parts[parts.length - 1]}` : (parts[0] || '');
    return txt.charAt(0).toUpperCase() + txt.slice(1);
  }

  // manual: opened by hand from Inbox, so no buzz and no notification screen.
  fireSummary(id, manual) {
    const w = this.m.w[id];
    if (!w.pending.length) return;
    if (!manual && (this.isPresent(id) || this.isQuiet(id))) { w.sumDue = true; return; }
    this.prunePending(id);
    if (!w.pending.length) return;
    // A fixed snapshot: its members stay put while it is open; the items themselves stay pending until done.
    const items = w.pending.slice();
    items.forEach(x => {
      const it = x.key === 'group' ? this.m.grp[x.gid] : this.inboxItem(x);
      if (it) it.held = false;
      if (it && it.out) it.out.wait = '';
    });
    w.summary = { at: manual ? this.now() : (w.sumAt || this.now()), items, text: this.sumText(items) };
    w.sumIdx = 0;
    if (manual) { this.go(id, 'sumItem'); return; }
    this.haptic(id, 'remind');
    if (w.screen === 'call') { this.commit(); return; }
    this.go(id, 'summary');
  }

  sumOpen(id) {
    this.m.w[id].sumIdx = 0;
    this.replace(id, 'sumItem');
  }

  sumNext(id) {
    const w = this.m.w[id];
    if (!w.summary) return;
    if (w.sumIdx < w.summary.items.length - 1) { w.sumIdx += 1; this.commit(); return; }
    this.replace(id, 'sumEnd');
  }

  // Close leaves the summary walk and returns to where the wearer was.
  sumClose(id) {
    const w = this.m.w[id];
    const S = ['summary', 'sumItem', 'sumEnd'];
    while (w.stack.length && S.indexOf(w.stack[w.stack.length - 1]) >= 0) w.stack.pop();
    this.leave(id);
    w.screen = w.stack.length ? w.stack.pop() : 'face';
    if (w.screen === 'face') w.stack = [];
    this.enter(id, w.screen);
    this.commit();
  }

  // Each tick: a summary falls due when the clock passes one of the watch's summary times.
  sumTick(id) {
    const w = this.m.w[id];
    const now = this.minNow();
    if (w.lastMin === null) { w.lastMin = now; return; }
    if (now === w.lastMin) return;
    const from = (w.lastMin + 1) % 1440;
    const to = (now + 1) % 1440;
    w.lastMin = now;
    if (w.sumDue && !this.isPresent(id) && !this.isQuiet(id)) { w.sumDue = false; this.fireSummary(id); return; }
    const hit = w.sumTimes.find(t => this.inWindow(from, to, t));
    if (hit === undefined || !w.pending.length) return;
    w.sumAt = this.fmtMin(hit);
    this.fireSummary(id);
  }

  // Clock seconds just after this watch's next summary time.
  nextSumSec(id) {
    const sod = ((this.K.START + this.m.sec) % 86400 + 86400) % 86400;
    const ts = this.m.w[id].sumTimes.map(t => t * 60);
    const next = ts.find(t => t > sod);
    return this.m.sec + (next !== undefined ? next - sod : ts[0] + 86400 - sod) + 60;
  }

  sumTime(id, t) {
    const w = this.m.w[id];
    const has = w.sumTimes.indexOf(t) >= 0;
    if (has && w.sumTimes.length === 1) { this.toast(id, 'Keep one time'); return; }
    if (!has && w.sumTimes.length >= 3) { this.toast(id, 'Up to 3 times'); return; }
    w.sumTimes = has ? w.sumTimes.filter(x => x !== t) : w.sumTimes.concat([t]).sort((a, b) => a - b);
    this.commit();
  }

  favToggle(id, name) {
    const w = this.m.w[id];
    const has = w.favs.indexOf(name) >= 0;
    if (!has && w.favs.length >= 5) { this.toast(id, 'Up to 5 people'); return; }
    w.favs = has ? w.favs.filter(x => x !== name) : w.favs.concat([name]);
    this.commit();
  }

  /* ---------- calls from favourites: the watch's own number ---------- */

  // Demo control: someone calls Maya's watch.
  callIn(name) {
    const id = 'maya';
    const w = this.m.w[id];
    if (w.call) return;
    if (w.favs.indexOf(name) < 0) {
      this.m.callNote = `${name} called ${this.nm(id)} at ${this.now()}. Not a favourite, so the watch never rang.`;
      this.commit();
      return;
    }
    this.m.callNote = '';
    if (this.isPresent(id) || (this.isQuiet(id) && !w.favQuiet)) {
      this.holdForSummary(id, { key: 'call', owner: id, title: `Missed call, ${name}`, from: name, screen: '' });
      return;
    }
    const stamp = ++this.seq;
    w.call = { name, state: 'ringing', start: 0, stamp };
    this.haptic(id, 'call');
    this.go(id, 'call');
    this.later(30000, () => {
      if (!w.call || w.call.stamp !== stamp || w.call.state !== 'ringing') return;
      this.holdForSummary(id, { key: 'call', owner: id, title: `Missed call, ${name}`, from: name, screen: '' });
      w.call.state = 'missed';
      if (w.screen === 'call') this.back(id); else w.call = null;
      this.commit();
    });
  }

  callAnswer(id) {
    const c = this.m.w[id].call;
    if (!c || c.state !== 'ringing') return;
    c.state = 'active';
    c.start = this.m.sec;
    this.commit();
  }

  leave(id) {
    const w = this.m.w[id];
    const d = this.m.draft[id];
    if (w.screen === 'memoRec' && d && d.phase === 'rec') { this.clearLevel(id); this.m.draft[id] = null; }
    if (w.screen === 'talk' && this.m.ptt === id) this.endTalk(id);
    if (w.screen === 'talk') w.talkAuto = false;
    if (w.screen === 'memoPlay') this.stopPlay(id);
    if (w.screen === 'call') w.call = null;
    // Leaving Add a friend any way (Back key, Cancel, Home) cancels the pairing on both watches.
    if (w.screen === 'addFriend') {
      if (w.friendState !== 'done') w.friendState = 'idle';
      const oid = this.other(id);
      const o = this.m.w[oid];
      if (o.friendState === 'near' || o.friendState === 'confirmed') {
        o.friendState = 'idle';
        this.toast(oid, `${this.nm(id)} cancelled`);
        this.haptic(oid, 'tick');
      }
    }
  }

  enter(id, screen) {
    const w = this.m.w[id];
    w.scroll = 0;
    // A creation flow entered from outside starts with no ticks.
    const prev = w.stack[w.stack.length - 1];
    if (this.K.FLOW.indexOf(screen) >= 0 && this.K.FLOW.indexOf(prev) < 0) w.picked = {};
    if (screen === 'calendar' && w.signal !== 'none') w.calSynced = this.now();
    if (screen === 'addFriend' && w.friendState !== 'near' && w.friendState !== 'confirmed') { w.friendState = this.m.friends ? 'done' : 'idle'; w.justAdded = false; }
    if (screen === 'torch') w.torch = 'red';
    if (screen === 'memoRec') {
      const old = this.m.draft[id];
      this.m.draft[id] = { phase: 'idle', dur: 0, textOn: w.memoText, transcript: '', transcribing: false, released: false, start: 0, now: false };
    }
    this.m.inbox[id].forEach(e => { if (e.screen === screen) e.unread = false; });
  }

  go(id, screen) {
    const w = this.m.w[id];
    if (w.screen === screen) return;
    this.leave(id);
    w.stack.push(w.screen);
    w.screen = screen;
    this.enter(id, screen);
    this.commit();
  }

  replace(id, screen) {
    const w = this.m.w[id];
    w.screen = screen;
    this.enter(id, screen);
    this.commit();
  }

  back(id) {
    const w = this.m.w[id];
    w.fromSum = false;
    // Back on the memo review discards the memo.
    if (w.screen === 'memoReview') this.m.draft[id] = null;
    if (w.screen === 'sumItem' && w.sumIdx > 0) { w.sumIdx -= 1; this.commit(); return; }
    if (w.screen === 'sumEnd' && w.summary && w.summary.items.length) { w.sumIdx = w.summary.items.length - 1; this.replace(id, 'sumItem'); return; }
    this.leave(id);
    w.screen = w.stack.length ? w.stack.pop() : 'face';
    if (w.screen === 'face') w.stack = [];
    this.enter(id, w.screen);
    this.commit();
  }

  // Home key: from the face it opens the watch's app list; anywhere else it returns to the face.
  homeKey(id) {
    const w = this.m.w[id];
    this.leave(id);
    if (w.screen === 'face') { w.stack = ['face']; w.screen = 'apps'; }
    else { w.stack = []; w.screen = 'face'; }
    this.enter(id, w.screen);
    this.commit();
  }

  // Sending from a one-question flow drops its picker screens from the back stack.
  endFlow(id, screen) {
    const w = this.m.w[id];
    w.stack = w.stack.filter(x => this.K.FLOW.indexOf(x) < 0);
    if (this.K.FLOW.indexOf(w.screen) < 0 && w.screen !== screen) w.stack.push(w.screen);
    this.replace(id, screen);
  }

  // Where: the arrow when the friend shares, otherwise ask.
  whereFor(id) {
    const L = this.m.loc[id];
    if (L && L.fixSec !== null && (L.answer === 'once' || L.answer === 'period') && !L.stoppedSeen) this.findFriend(id);
    else this.askWhere(id);
  }

  meetWhenTxt(d) {
    if (d.when === 0) return 'Now';
    return `At ${this.fmtMin(d.when === -1 ? d.at : this.minNow() + d.when)}`;
  }

  jump(id, screen, stack) {
    const w = this.m.w[id];
    this.leave(id);
    w.stack = stack.slice();
    w.screen = screen;
    this.enter(id, screen);
    this.commit();
  }

  onScroll(id, e) {
    const el = e && e.currentTarget;
    this.m.w[id].scroll = el ? el.scrollTop : 0;
    this.commit();
  }

  /* ---------- demo controls ---------- */

  setSignal(id, sig) {
    const w = this.m.w[id];
    const was = w.signal;
    if (was === sig) return;
    const A = this.nm(id);
    if (sig === 'none') {
      w.lastSeen = this.now();
      if (this.m.ptt === id) this.endTalk(id);
    }
    w.signal = sig;
    const M = w.music;
    if (sig === 'none' && M.playing && !this.K.PLAYLISTS[M.pl].offline) { M.playing = false; M.blocked = true; }
    if (sig !== 'none') M.blocked = false;
    const word = sig === 'lte' ? 'LTE' : 'Wi-Fi';
    if (was === 'none') this.log({ plain: `${A}'s watch checked in.`, tech: `CHECK-IN ${A} → server | ${word}` });
    else if (sig !== 'none') this.log({ plain: `${A}'s watch switched to ${word}.`, tech: `SWITCH ${A} | ${word} | retry queue` });
    this.pump();
    this.commit();
  }

  toggleLowBatt(id) {
    const w = this.m.w[id];
    w.lowBatt = !w.lowBatt;
    if (w.lowBatt && !w.lowPower) {
      this.haptic(id, 'needs');
      this.go(id, 'lowOffer');
    }
    this.commit();
  }

  toggleCompass(id) {
    const w = this.m.w[id];
    w.compassBad = !w.compassBad;
    w.fallback = 'calibrate';
    this.commit();
  }

  setFallback(id, f) {
    this.m.w[id].fallback = f;
    this.commit();
  }

  sendStatus(id) {
    const w = this.m.w[id];
    const words = (w.present || this.hangNow(id) ? 'present' : this.isQuiet(id) ? this.quietText(id) : 'free') + (w.lowPower ? ', low power' : '');
    const snap = this.snapStatus(id);
    const to = this.other(id);
    this.send({ from: id, to, what: `status: ${words}`, ttl: 1440, prio: 'normal', receipt: false, onArrive: () => {
      this.m.heard[to] = snap;
      // Present ended on the other watch: its "Things wait" line on my sent items goes away.
      if (!snap.present) ['ping', 'memo', 'meet', 'hang', 'poll'].forEach(k => { const it = this.m[k][to]; if (it && it.out && it.out.wait === `${this.nm(id)} is present. It waits.`) it.out.wait = ''; });
      this.commit();
    } });
  }

  setStatus(id, st) {
    const w = this.m.w[id];
    w.status = st;
    if (st !== 'Free') w.until = st === 'Sleeping' ? '08:00' : this.fmt(this.m.sec + 3600);
    this.sendStatus(id);
    this.commit();
  }

  toggleDnd(id) {
    const w = this.m.w[id];
    w.dnd = !w.dnd;
    if (w.dnd) w.until = this.fmt(this.m.sec + 3600);
    this.sendStatus(id);
    this.haptic(id, 'tick');
    this.commit();
  }

  toggleLowPower(id) {
    const w = this.m.w[id];
    w.lowPower = !w.lowPower;
    if (w.lowPower && this.m.ptt === id) this.endTalk(id);
    if (!w.lowPower) this.pump();
    this.sendStatus(id);
    this.toast(id, w.lowPower ? 'Low-power mode on' : 'Low-power mode off');
    this.commit();
  }

  quietToggle(id) {
    const w = this.m.w[id];
    w.quietOn = !w.quietOn;
    this.sendStatus(id);
    this.commit();
  }

  quietShift(id, which, delta) {
    const w = this.m.w[id];
    const key = which === 'start' ? 'quietStart' : 'quietEnd';
    w[key] = ((w[key] + delta) % 1440 + 1440) % 1440;
    this.sendStatus(id);
    this.commit();
  }

  listedToggle(id) {
    const w = this.m.w[id];
    w.listed = !w.listed;
    const A = this.nm(id);
    this.log({
      plain: `${A} ${w.listed ? 'joined' : 'left'} the people list.`,
      tech: `PEOPLE-LIST ${A} → server | ${w.listed ? 'listed' : 'not listed'} | signed, relayed to every member`,
    });
    this.commit();
  }

  colorPick(id, i) {
    this.m.w[id].color = i;
    this.commit();
  }

  torchNext(id) {
    const w = this.m.w[id];
    w.torch = this.K.TORCH[w.torch][4];
    this.commit();
  }

  dictate(id, kind) {
    this.toast(id, 'Listening');
    this.later(1300, () => {
      const w = this.m.w[id];
      if (kind === 'reply') {
        if (w.screen === 'replies') this.back(id);
        this.reply(id, w.replyCtx, 'Running 5 min late');
      } else if (kind === 'what') {
        this.m.hangDraft[id].title = 'Bonfire';
        if (w.screen === 'hangNew') this.go(id, 'placePick');
      } else if (kind === 'group') {
        w.groupDraft.title = 'Night swim';
        if (w.screen === 'groupNew') this.go(id, 'groupEnds');
      } else if (kind === 'question') {
        this.m.pollDraft[id].q = 'Bonfire at 9?';
        if (w.screen === 'pollNew') this.go(id, 'pollAnswers');
      }
      this.commit();
    });
  }

  /* ---------- ping and replies (3.5) ---------- */

  pingedAt(id) {
    const t = this.m.lastPing[id];
    return t !== null && this.m.sec - t < 600 ? t : null;
  }

  sendPing(id, text) {
    if (text === 'Where are you?') { this.askWhere(id); return; }
    if (this.pingedAt(id) !== null) return;
    this.m.lastPing[id] = this.m.sec;
    const peer = this.other(id);
    const iid = ++this.seq;
    const P = this.m.ping[id] = { id: iid, from: id, to: peer, text, sentAt: this.now(), out: { state: 'none' }, back: null, reply: '', replyText: '', arrivedQuiet: false };
    this.endFlow(id, 'pingOut');
    this.send({
      from: id, to: peer, what: `ping "${text}"`, ttl: 30, quietable: true, track: { key: 'ping', owner: id, id: iid, slot: 'out' },
      onArrive: (quiet) => {
        if (this.m.ping[id] !== P) return;
        P.arrivedQuiet = quiet;
        this.arrive(peer, 'ping', id, text, 'pingIn', 'ping');
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  openReplies(id, ctx) {
    this.m.w[id].replyCtx = ctx;
    this.go(id, 'replies');
  }

  reply(id, ctx, r) {
    if (ctx === 'meet') this.meetReply(id, r);
    else this.pingReply(id, r);
    this.sumReturn(id);
  }

  pingReply(id, r) {
    const peer = this.other(id);
    const P = this.m.ping[peer];
    if (!P || P.back) return;
    P.back = { state: 'none' };
    P.replyText = r;
    this.send({
      from: id, to: peer, what: `quick reply "${r}"`, ttl: 30, track: { key: 'ping', owner: peer, id: P.id, slot: 'back' },
      onArrive: () => {
        if (this.m.ping[peer] !== P) return;
        P.reply = r;
        this.haptic(peer, 'reply');
        if (this.m.w[peer].screen !== 'pingOut') this.toast(peer, `${this.nm(id)}: ${r}`);
        this.commit();
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  /* ---------- memos (3.7, 3.30) ---------- */

  clearLevel(id) {
    if (this.levelIds[id]) { clearInterval(this.levelIds[id]); this.levelIds[id] = null; }
  }

  memoDown(id) {
    const w = this.m.w[id];
    if (w.rec) { this.toast(id, 'Recording is using the mic'); return; }
    const old = this.m.draft[id];
    if (old && old.phase === 'rec') return;
    this.m.draft[id] = { phase: 'rec', start: Date.now(), dur: 0, textOn: w.memoText, transcript: '', transcribing: false, released: false, now: false };
    this.haptic(id, 'tick');
    this.clearLevel(id);
    this.levelIds[id] = setInterval(() => {
      const d = this.m.draft[id];
      if (!d || d.phase !== 'rec') { this.clearLevel(id); return; }
      d.dur = (Date.now() - d.start) / 1000;
      const tt = Date.now() / 180;
      w.levels = w.levels.map((v, i) => Math.max(0.08, Math.min(1, 0.2 + Math.random() * 0.55 + 0.25 * Math.sin(tt + i))));
      if (d.dur >= 60 || (d.released && d.dur >= 3)) { this.memoStop(id); return; }
      this.commit();
    }, 110);
    this.commit();
  }

  memoUp(id) {
    const d = this.m.draft[id];
    if (!d || d.phase !== 'rec' || d.released) return;
    const el = (Date.now() - d.start) / 1000;
    if (el >= 1) this.memoStop(id);
    else { d.released = true; this.commit(); }
  }

  memoStop(id) {
    const d = this.m.draft[id];
    const w = this.m.w[id];
    if (!d || d.phase !== 'rec') return;
    this.clearLevel(id);
    d.dur = Math.max(1, Math.round((Date.now() - d.start) / 1000));
    d.phase = 'review';
    w.levels = w.levels.map(() => 0.2);
    this.haptic(id, 'tick');
    if (d.textOn) this.transcribe(id, d);
    if (w.screen === 'memoRec') this.replace(id, 'memoReview');
    this.commit();
  }

  transcribe(id, d) {
    d.transcribing = true;
    d.transcript = '';
    this.later(1400, () => {
      if (this.m.draft[id] !== d || !d.textOn) return;
      d.transcribing = false;
      d.transcript = this.K.TRANSCRIPT[id];
      this.commit();
    });
  }

  toggleText(id) {
    const d = this.m.draft[id];
    if (!d) return;
    d.textOn = !d.textOn;
    if (d.phase === 'review') {
      if (d.textOn && !d.transcript) this.transcribe(id, d);
      if (!d.textOn) d.transcribing = false;
    }
    this.commit();
  }

  memoSend(id) {
    const d = this.m.draft[id];
    if (!d || d.phase !== 'review' || d.transcribing) return;
    const peer = this.other(id);
    const iid = ++this.seq;
    const text = d.textOn ? d.transcript : '';
    const later = !d.now;
    const mm = this.m.memo[id] = { id: iid, from: id, to: peer, dur: d.dur, transcript: text, out: { state: 'none' }, heard: false, playing: false, progress: 0, arrived: false, arrivedAt: '', arrivedQuiet: false, playedAt: '', held: later };
    this.m.draft[id] = null;
    this.replace(id, 'memoOut');
    const kb = 4 * Math.ceil((d.dur * 4 + 1) / 4);
    this.send({
      from: id, to: peer, what: `memo ${this.dur(d.dur)}, ${text ? 'audio and text' : 'audio only'}, ${later ? 'later' : 'now'}`, size: `${kb} KB`, prio: 'normal', ttl: 7 * 1440, memo: true, quietable: true, later,
      track: { key: 'memo', owner: id, id: iid, slot: 'out' },
      onArrive: (quiet) => {
        if (this.m.memo[id] !== mm) return;
        mm.arrived = true;
        mm.arrivedAt = this.now();
        mm.arrivedQuiet = quiet || later;
        if (later || !this.m.w[peer].nowFriends) { mm.held = true; this.holdForSummary(peer, { key: 'memo', owner: id, title: `Memo, ${this.dur(mm.dur)}`, from: this.nm(id), screen: 'memoIn' }); return; }
        this.arrive(peer, 'memo', id, `Memo, ${this.dur(mm.dur)}`, 'memoIn', 'memo');
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  memoPause(id) {
    const mm = this.m.memo[this.other(id)];
    if (!mm || !mm.playing) return;
    this.stopPlay(id);
    this.commit();
  }

  memoDiscard(id) {
    this.m.draft[id] = null;
    this.back(id);
  }

  stopPlayTimer(id) {
    if (this.playIds[id]) { clearInterval(this.playIds[id]); this.playIds[id] = null; }
  }

  stopPlay(id) {
    this.stopPlayTimer(id);
    this.musicResume(id, 'memo');
    const mm = this.m.memo[this.other(id)];
    if (mm) mm.playing = false;
  }

  memoPlay(id) {
    const peer = this.other(id);
    const mm = this.m.memo[peer];
    if (!mm || !mm.arrived) return;
    const sc = this.m.w[id].screen;
    if (sc === 'memoIn') this.replace(id, 'memoPlay');
    else if (sc !== 'memoPlay') this.go(id, 'memoPlay');
    if (mm.progress >= 1) mm.progress = 0;
    mm.playing = true;
    this.musicPause(id, 'memo');
    if (!mm.heard) {
      mm.heard = true;
      this.send({
        from: id, to: peer, what: 'read receipt: played', prio: 'normal', ttl: 60, receipt: false,
        onArrive: () => {
          if (this.m.memo[peer] !== mm) return;
          mm.playedAt = this.now();
          this.track({ track: { key: 'memo', owner: peer, id: mm.id, slot: 'out' } }, { state: 'played', wait: '' });
          this.receiptTick(peer, 'memo');
          this.commit();
        },
      });
    }
    this.stopPlayTimer(id);
    const total = Math.max(1, mm.dur) * 1000;
    const start = Date.now() - mm.progress * total;
    this.playIds[id] = setInterval(() => {
      mm.progress = Math.min(1, (Date.now() - start) / total);
      if (mm.progress >= 1) { mm.playing = false; this.stopPlayTimer(id); this.musicResume(id, 'memo'); this.sumReturn(id); }
      this.commit();
    }, 100);
    this.commit();
  }

  /* ---------- location request, sharing and arrow (3.4, 3.6) ---------- */

  askWhere(id) {
    const peer = this.other(id);
    const iid = ++this.seq;
    const L = this.m.loc[id] = {
      id: iid, from: id, to: peer, out: { state: 'none' }, back: null, answer: null, peerChoice: null, fixSec: null, lastFix: 0, untilSec: 0,
      stopped: false, stoppedAt: '', stoppedSeen: false, dist: 140, prevDist: 190, expires: this.fmt(this.m.sec + 600), expSec: this.m.sec + 600, cancel: '', job: null, pausedText: '',
    };
    const sc = this.m.w[id].screen;
    if (sc === 'pingPick') this.endFlow(id, 'askOut');
    else if (sc === 'arrow') this.replace(id, 'askOut');
    else this.go(id, 'askOut');
    L.job = this.send({
      from: id, to: peer, what: 'location request', ttl: 10, track: { key: 'loc', owner: id, id: iid, slot: 'out' },
      onArrive: () => {
        if (this.m.loc[id] !== L || L.cancel === 'done') return;
        if (this.isQuiet(peer) || this.presentSocial(peer)) {
          const present = this.presentSocial(peer);
          const qs = present ? `Not now. ${this.nm(peer)} is present` : this.quietSentence(peer);
          if (!present) this.haptic(peer, 'quiet');
          this.later(500, () => this.send({
            from: peer, to: id, what: 'location answer: paused', ttl: 20, receipt: false,
            onArrive: () => {
              if (this.m.loc[id] !== L) return;
              L.answer = 'paused';
              L.pausedText = present ? `${qs}.` : `${qs}. Requests paused.`;
              this.haptic(id, 'tick');
              this.commit();
            },
          }));
          return;
        }
        this.arrive(peer, 'loc', id, 'Where are you?', 'locIn', 'invite');
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  cancelAsk(id) {
    const L = this.m.loc[id];
    if (!L || L.answer || L.cancel) return;
    const peer = this.other(id);
    if (L.job && L.job.stage === 'upload' && this.K.RANK[L.out.state] < 2) {
      L.job.dead = true;
      this.jobs = this.jobs.filter(j => j !== L.job);
      this.m.loc[id] = null;
      this.back(id);
      this.toast(id, 'Discarded');
      return;
    }
    L.cancel = 'requested';
    this.send({
      from: id, to: peer, what: 'cancel, bound to the request', ttl: 20, receipt: false,
      onArrive: () => {
        if (this.m.loc[id] !== L) return;
        const already = !!L.peerChoice;
        if (!already) {
          this.m.inbox[peer] = this.m.inbox[peer].filter(e => !(e.key === 'loc' && e.owner === id));
          if (this.m.w[peer].screen === 'locIn') this.back(peer);
        }
        this.send({
          from: peer, to: id, what: already ? 'read receipt: already opened' : 'cancel confirmed', prio: 'normal', ttl: 60, receipt: false,
          onArrive: () => { if (this.m.loc[id] !== L) return; L.cancel = already ? 'already' : 'done'; this.commit(); },
        });
        this.commit();
      },
    });
    this.commit();
  }

  shareAnswer(aid, mode) {
    const r = this.other(aid);
    const L = this.m.loc[r];
    if (!L || L.peerChoice || L.cancel === 'done') return;
    L.peerChoice = mode;
    L.back = { state: 'none' };
    L.lastFix = this.m.sec;
    if (mode === 'period') L.untilSec = this.m.sec + 1800;
    if (mode === 'no') this.back(aid);
    else this.replace(aid, 'sharing');
    this.haptic(aid, 'tick');
    const what = mode === 'no' ? 'location answer: not now' : mode === 'once' ? 'location fix, share once' : 'location fix, sharing 30 min';
    this.send({
      from: aid, to: r, what, ttl: 10, track: { key: 'loc', owner: r, id: L.id, slot: 'back' },
      onArrive: () => {
        if (this.m.loc[r] !== L) return;
        L.answer = mode;
        if (mode !== 'no') L.fixSec = this.m.sec;
        this.haptic(r, 'reply');
        if (mode !== 'no') {
          if (this.m.w[r].screen === 'askOut') this.replace(r, 'arrow');
          else this.toast(r, `${this.nm(aid)} shared their location`);
        }
        this.commit();
      },
    });
    this.commit();
  }

  stopSharing(aid) {
    const r = this.other(aid);
    const L = this.m.loc[r];
    if (!L || L.stopped) return;
    L.stopped = true;
    L.stoppedAt = this.now();
    this.send({
      from: aid, to: r, what: 'sharing ended', ttl: 30, prio: 'normal', receipt: false,
      onArrive: () => { if (this.m.loc[r] !== L) return; L.stoppedSeen = true; this.commit(); },
    });
    this.commit();
  }

  /* ---------- meeting points (3.11) ---------- */

  meetPick(id, place) {
    this.m.meetDraft[id].place = place;
    this.commit();
  }

  meetWhen(id) {
    const d = this.m.meetDraft[id];
    d.when = (d.when + 1) % 4;
    this.commit();
  }

  sendMeet(id) {
    const peer = this.other(id);
    const d = this.m.meetDraft[id];
    const iid = ++this.seq;
    const pl = this.K.PLACES.find(p => p[0] === d.place) || this.K.PLACES[0];
    const whenTxt = this.meetWhenTxt(d);
    if (!this.m.friends) { this.toast(id, 'Add a friend first'); return; }
    const M = this.m.meet[id] = { id: iid, from: id, to: peer, place: d.place, whenTxt, expSec: this.m.sec + this.expSecs(d.exp), out: { state: 'none' }, back: null, chk: null, reply: '', replyText: '', here: false, hereAt: '', dist: pl[1], walking: false };
    this.endFlow(id, 'meetOut');
    this.send({
      from: id, to: peer, what: `meeting point: ${d.place}, ${whenTxt.toLowerCase()}`, ttl: 120, quietable: true, track: { key: 'meet', owner: id, id: iid, slot: 'out' },
      onArrive: () => {
        if (this.m.meet[id] !== M) return;
        this.arrive(peer, 'meet', id, `Meet: ${d.place}`, 'meetIn', 'ping');
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  meetReply(id, r) {
    const peer = this.other(id);
    const M = this.m.meet[peer];
    if (!M || M.back) return;
    M.replyText = r;
    M.back = { state: 'none' };
    M.walking = r !== "Can't make it";
    this.send({
      from: id, to: peer, what: `quick reply "${r}"`, ttl: 120, track: { key: 'meet', owner: peer, id: M.id, slot: 'back' },
      onArrive: () => {
        if (this.m.meet[peer] !== M) return;
        M.reply = r;
        this.haptic(peer, 'reply');
        if (this.m.w[peer].screen !== 'meetOut') this.toast(peer, `${this.nm(id)}: ${r}`);
        this.commit();
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  imHere(id) {
    const peer = this.other(id);
    const M = this.m.meet[peer];
    if (!M || M.chk || M.dist > 50) return;
    M.chk = { state: 'none' };
    this.send({
      from: id, to: peer, what: '"I\'m here" check-in, no position inside', ttl: 120, track: { key: 'meet', owner: peer, id: M.id, slot: 'chk' },
      onArrive: () => {
        if (this.m.meet[peer] !== M) return;
        M.here = true;
        M.hereAt = this.now();
        this.haptic(peer, 'here');
        if (this.m.w[peer].screen !== 'meetOut') this.toast(peer, `${this.nm(id)} is here: ${M.place}`);
        this.commit();
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  /* ---------- plan a hang (3.26) ---------- */

  hangTime(id, delta) {
    const d = this.m.hangDraft[id];
    d.time = Math.max(6 * 60, Math.min(23 * 60 + 45, d.time + delta));
    this.commit();
  }

  hangSpots(id, delta) {
    const d = this.m.hangDraft[id];
    d.spots = Math.max(2, Math.min(20, d.spots + delta));
    this.commit();
  }

  hangTo(id) {
    const d = this.m.hangDraft[id];
    const opts = this.toOpts(id);
    d.to = opts[(opts.indexOf(d.to) + 1) % opts.length];
    this.commit();
  }

  sendHang(id) {
    const peer = this.other(id);
    const d = this.m.hangDraft[id];
    const iid = ++this.seq;
    const toAll = d.to === 'all';
    const skipped = this.skipsPeer(id, d.to);
    const H = this.m.hang[id] = {
      id: iid, from: id, to: peer, title: d.title, place: d.place, time: d.time, spots: d.spots, toAll, skipped, taken: 1, spot: 0, expSec: this.m.sec + this.expSecs(d.exp),
      out: { state: 'none' }, back: null, conf: null, answer: null, waitlisted: false, confirmed: false, passed: false, withdrawn: false, peerLeft: false, askedSent: '', arrived: '',
    };
    this.endFlow(id, 'hangHost');
    const what = `hang invite: ${d.title}, ${this.fmtMin(d.time)}, ${d.place}, ${d.spots} spots`;
    if (toAll) this.fanout(id, what);
    if (skipped) this.later(900, () => { if (this.m.hang[id] === H && this.sigOf(id) !== 'none') { H.out = { state: 'sent' }; this.commit(); } });
    if (!skipped) {
      this.send({
        from: id, to: peer, what, ttl: 60, quietable: true, track: { key: 'hang', owner: id, id: iid, slot: 'out' },
        onArrive: () => {
          if (this.m.hang[id] !== H) return;
          this.arrive(peer, 'hang', id, `${H.title} ${this.fmtMin(H.time)}`, 'hangIn', 'invite');
        },
      });
    }
    this.haptic(id, 'tick');
    this.commit();
  }

  hangAnswer(id, choice) {
    const peer = this.other(id);
    const H = this.m.hang[peer];
    if (!H || H.answer) return;
    H.answer = choice;
    H.back = { state: 'none' };
    H.askedSent = this.now();
    this.sumReturn(id);
    this.send({
      from: id, to: peer, what: choice === 'in' ? 'hang answer: yes' : 'hang answer: pass', ttl: 60, track: { key: 'hang', owner: peer, id: H.id, slot: 'back' },
      onArrive: () => {
        if (this.m.hang[peer] !== H) return;
        H.arrived = this.now();
        this.receiptTick(peer, 'hang');
        if (choice === 'in') this.hangAuto(peer);
        else { H.passed = true; this.commit(); }
      },
    });
    this.haptic(id, 'tick');
    this.commit();
  }

  // D51: the host's watch signs the confirmation itself, in order of arrival while spots last.
  // Nobody approves a Join twice. With no spot left, the joiner goes on the waitlist.
  hangAuto(id) {
    const peer = this.other(id);
    const H = this.m.hang[id];
    if (!H || H.conf || H.waitlisted) return;
    if (H.taken >= H.spots) {
      H.waitlisted = true;
      this.send({ from: id, to: peer, what: 'hang answer: waitlist, signed by the host', ttl: 60, receipt: false, onArrive: () => this.commit() });
      this.commit();
      return;
    }
    H.taken += 1;
    H.spot = H.taken;
    H.conf = { state: 'none' };
    this.send({
      from: id, to: peer, what: `hang confirmation: in, spot ${H.spot} of ${H.spots}, signed by the host`, ttl: 60, track: { key: 'hang', owner: id, id: H.id, slot: 'conf' },
      onArrive: () => {
        if (this.m.hang[id] !== H) return;
        H.confirmed = true;
        this.receiptTick(peer, 'hang');
        this.commit();
      },
    });
    this.commit();
  }

  hangCant(id) {
    const peer = this.other(id);
    const H = this.m.hang[peer];
    if (!H || !H.confirmed || H.withdrawn) return;
    H.withdrawn = true;
    this.send({
      from: id, to: peer, what: "hang answer: can't make it", ttl: 60, receipt: false,
      onArrive: () => {
        if (this.m.hang[peer] !== H) return;
        H.taken = Math.max(1, H.taken - 1);
        H.peerLeft = true;
        this.haptic(peer, 'reply');
        this.commit();
      },
    });
    this.commit();
  }

  /* ---------- polls (3.25) ---------- */

  pollOpt(id, opt) {
    const d = this.m.pollDraft[id];
    const i = d.opts.indexOf(opt);
    if (i >= 0) {
      if (d.opts.length <= 2) { this.toast(id, 'Keep at least 2 answers'); return; }
      d.opts.splice(i, 1);
    } else {
      if (d.opts.length >= 4) { this.toast(id, 'Up to 4 answers'); return; }
      d.opts.push(opt);
      const order = this.K.POLLOPTS;
      d.opts.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    }
    this.commit();
  }

  pollTo(id) {
    const d = this.m.pollDraft[id];
    const opts = this.toOpts(id);
    d.to = opts[(opts.indexOf(d.to) + 1) % opts.length];
    this.commit();
  }

  sendPoll(id) {
    const peer = this.other(id);
    const d = this.m.pollDraft[id];
    if (d.opts.length < 2) { this.toast(id, 'Pick 2 to 4 answers'); return; }
    const iid = ++this.seq;
    const toAll = d.to === 'all';
    const skipped = this.skipsPeer(id, d.to);
    // exp -1: a Later poll closes an hour after the recipient's next summary.
    const expSec = d.exp === -1 ? this.nextSumSec(peer) - 60 + 3600 : this.m.sec + this.expSecs(d.exp);
    const votes = {};
    d.opts.forEach(o => { votes[o] = 0; });
    const P = this.m.poll[id] = {
      id: iid, from: id, to: peer, q: d.q, opts: d.opts.slice(), votes, voters: [], peerVote: '', closes: this.fmt(expSec), expSec, held: !d.now,
      asked: toAll ? (skipped ? 5 : 6) : 1, toAll, skipped, out: { state: 'none' }, back: null,
    };
    this.endFlow(id, 'pollHost');
    const what = `poll "${d.q}" ${d.opts.join(' / ')}`;
    if (toAll) {
      this.fanout(id, what);
      const o = P.opts;
      const votes = () => [['Sam', o[0], 2400], ['Ana', o[o.length - 1], 4100], ['Leo', o[0], 6300]].forEach(v => this.later(v[2], () => {
        if (this.m.poll[id] !== P) return;
        if (this.isExp(P)) return;
        this.simDeliver(id, v[0], `vote: ${v[1]}`, () => {
          if (this.m.poll[id] !== P || this.isExp(P)) return;
          P.votes[v[1]] += 1;
          P.voters.push({ name: v[0], choice: v[1] });
        });
      }));
      if (P.held) { P.simDue = this.nextSumSec(peer); P.simRelease = votes; } else votes();
    }
    if (skipped) this.later(900, () => { if (this.m.poll[id] === P && this.sigOf(id) !== 'none') { P.out = { state: 'sent' }; this.commit(); } });
    if (!skipped) {
      this.send({
